<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCH Custom Order Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --ink:#1A1A1A; --body:#333; --muted:#888; --rule:#999; --hairline:#DDD;
    --accent:#C4A464; --bg:#f5f7fa; --field:#fafbfc; --border:#cfd6e0;
    --flag:#B8782F; --selected:#1A1A1A;
    --cch-navy:#1B3352; --cch-navy-deep:#152a45; --cch-gold:#C4A464;
    --rail-text:rgba(255,255,255,.92); --rail-muted:rgba(255,255,255,.58);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:Calibri,Arial,sans-serif;color:var(--body);background:#eef1f6}
  button{font-family:inherit;cursor:pointer}
  header{background:#fff;border-bottom:1px solid var(--hairline);padding:14px 24px;display:flex;align-items:center;gap:24px}
  header h1{margin:0;font-family:Georgia,serif;font-size:22px;color:var(--ink);font-weight:700}
  header .sub{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .auth-note{margin-left:auto;font-size:11px;color:#555}
  nav.tabs{display:flex;gap:0}
  nav.tabs button{background:transparent;border:none;padding:10px 18px;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;border-bottom:2px solid transparent}
  nav.tabs button.active{color:var(--cch-navy);border-bottom-color:var(--cch-gold);font-weight:700}
  .builder-shell{display:grid;grid-template-columns:280px minmax(0,1fr);width:100%;min-height:calc(100vh - 64px);align-items:stretch;background:var(--bg)}
  .builder-shell .library-rail{align-self:stretch}
  main#app.builder-main{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(240px,0.9fr);gap:0;min-width:0;min-height:calc(100vh - 64px)}
  /* !important: survives stale caches / extensions overriding aside backgrounds */
  .library-rail,#libraryRail.library-rail{
    background-color:var(--cch-navy-deep)!important;
    background-image:linear-gradient(180deg,var(--cch-navy) 0%,var(--cch-navy-deep) 100%)!important;
    border-right:3px solid var(--cch-gold);overflow-y:auto;overflow-x:hidden;padding:12px 10px 80px;display:flex;flex-direction:column;gap:8px;width:280px;min-width:280px;max-width:280px;box-sizing:border-box;flex-shrink:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    min-height:calc(100vh - 64px);
    scrollbar-color:rgba(255,255,255,.28) rgba(0,0,0,.2);
    scrollbar-width:thin
  }
  .library-rail::-webkit-scrollbar{width:10px}
  .library-rail::-webkit-scrollbar-track{background:rgba(0,0,0,.18)}
  .library-rail::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
  .library-rail .btn.secondary{
    background:rgba(255,255,255,.1)!important;color:var(--rail-text)!important;
    border:1px solid rgba(255,255,255,.22)!important
  }
  .library-rail-boot h3{margin:0 0 6px;font-size:12px;letter-spacing:2px;color:var(--rail-text)}
  .library-rail h3{margin:0;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--rail-text);font-weight:700}
  .library-rail .sub{font-size:10px;color:var(--rail-muted);line-height:1.35;margin-bottom:4px}
  .library-rail-boot p{color:var(--rail-muted);font-size:11px;line-height:1.45;margin:0}
  .library-rail-boot code{font-size:10px;background:rgba(0,0,0,.25);color:var(--rail-text);padding:1px 5px;border-radius:2px}
  .lib-rail-select,.lib-rail-filter{width:100%;font-size:12px;padding:6px 8px;border:1px solid rgba(196,164,100,.35);background:rgba(255,255,255,.97);color:var(--ink);font-family:inherit;border-radius:2px}
  .lib-rail-filter{margin-top:2px}
  .lib-rail-label{font-size:9px;letter-spacing:1.2px;font-weight:700;color:var(--rail-muted);text-transform:uppercase;margin-top:4px}
  .lib-rail-crumb{font-size:10px;color:var(--rail-muted);word-break:break-word;line-height:1.35;padding:4px 0}
  .lib-rail-folders{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
  .lib-rail-folders .folder-tile{font-size:10px;padding:8px 6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--rail-text);cursor:pointer;text-align:center;line-height:1.2;border-radius:2px}
  .lib-rail-folders .folder-tile:hover{border-color:var(--cch-gold);background:rgba(255,255,255,.12)}
  .lib-rail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
  .library-rail .pick-card{border:2px solid transparent;background:#fff;cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .library-rail .pick-card:hover{border-color:var(--cch-gold)}
  .library-rail .pick-card img{width:100%;height:68px;object-fit:cover;background:#eee}
  .library-rail .pick-card .label{font-size:8.5px;padding:3px 4px;line-height:1.15;color:var(--body);min-height:28px}
  .lib-rail-actions{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
  .lib-rail-actions .btn-upload{font-size:10px;letter-spacing:1px;padding:8px 10px;border:1px solid var(--cch-gold);background:var(--cch-gold);color:var(--cch-navy-deep);cursor:pointer;width:100%;font-weight:700;border-radius:2px}
  .lib-rail-actions .btn-upload:hover{filter:brightness(1.05)}
  .lib-rail-actions .btn-mini{font-size:10px;padding:6px 8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;width:100%;border-radius:2px}
  .lib-rail-empty{font-size:11px;color:var(--rail-muted);font-style:italic;padding:8px 4px}
  .form-pane{background:#fff;overflow-y:auto;padding:20px 24px 120px;border-right:1px solid var(--hairline);min-width:0}
  .preview-pane{overflow-y:auto;padding:24px;background:#e8ecf2;min-width:0}
  .toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .toolbar .field{margin:0}
  .form-section{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--hairline)}
  .form-section:last-child{border-bottom:none}
  .form-section h2{font-size:11px;letter-spacing:3px;color:var(--ink);font-weight:700;text-transform:uppercase;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--accent)}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10px;letter-spacing:1.5px;color:var(--ink);font-weight:700;text-transform:uppercase}
  .field input[type=text],.field textarea,.field select{
    border:1px solid var(--border);background:#fff;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--ink);
    border-radius:0;outline:none;transition:border-color .15s
  }
  .field textarea{resize:vertical;min-height:54px}
  .field select[multiple]{min-height:120px;padding:6px}
  .spec-attach-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .spec-attach-bar .spec-thumb{width:48px;height:48px;object-fit:cover;border:1px solid var(--border);background:var(--field)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row.three{grid-template-columns:1fr 1fr 1fr}
  .chip-group{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);padding:5px 10px;font-size:12px;background:#fff;cursor:pointer}
  .chip input{display:none}
  .chip.checked{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
  .picker{margin:8px 0}
  .picker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .picker-head .picker-meta{font-size:11px;color:var(--muted)}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:230px;overflow-y:auto;padding:6px;border:1px solid var(--hairline);background:var(--field)}
  .pick-card{background:#fff;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column}
  .pick-card.selected{border-color:var(--ink)}
  .pick-card img{width:100%;height:80px;object-fit:cover;background:#eee}
  .pick-card .label{font-size:9.5px;color:var(--body);padding:4px 5px;line-height:1.2;min-height:26px}
  .picker-actions{display:flex;gap:6px;align-items:center}
  .picker-actions .btn-mini{border:1px solid var(--border);background:#fff;color:var(--ink);font-size:10px;letter-spacing:1px;padding:5px 8px}
  .picker-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
  .picker-modal{width:min(960px,92vw);max-height:86vh;background:#fff;border:1px solid var(--hairline);padding:14px;display:flex;flex-direction:column}
  .picker-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .picker-modal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto}
  .fabric-pick-thumb{width:76px;height:76px;border:1px solid var(--border);background:var(--field);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .fabric-pick-thumb img{width:100%;height:100%;object-fit:cover}
  .upload-box{border:2px dashed var(--border);background:var(--field);padding:18px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted);letter-spacing:1px}
  .upload-box.has-img{padding:0;border-style:solid;border-color:var(--ink)}
  .upload-box img{display:block;width:100%;max-height:180px;object-fit:cover}
  .upload-box .clear{font-size:10px;color:var(--flag);margin-top:6px;display:inline-block}
  .actions{position:sticky;bottom:-20px;margin-top:24px;padding:12px 0;background:#fff;border-top:1px solid var(--hairline);display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
  .btn.secondary{background:#fff;color:var(--ink)}
  .notice{padding:10px 12px;background:#FFF8E1;border:1px solid #E0CCA0;color:#7A5C20;font-size:12px;margin:8px 0}
  .error{background:#FFF0F0;border-color:#e8b6b6;color:#8e3434}
  .preview-page{width:1067px;height:600px;background:#fff;margin:0 auto 24px;box-shadow:0 4px 18px rgba(0,0,0,.12);position:relative;overflow:hidden}
  .preview-shrink{transform:scale(0.78);transform-origin:top left;margin-bottom:-130px}
  .preview-page .pp-header{display:flex;justify-content:space-between;padding:24px 32px 8px;color:var(--ink)}
  .preview-page .pp-title{font-size:22px;letter-spacing:1px}
  .preview-page .pp-title .num{color:var(--flag);font-style:italic;font-weight:700;margin-left:8px}
  .preview-page .pp-page{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .preview-page .pp-loc{padding:0 32px 14px;font-size:14px;color:var(--ink);letter-spacing:1px;border-bottom:1px solid var(--rule);position:relative}
  .preview-page .pp-treatment{position:absolute;right:32px;top:52px;font-size:10px;letter-spacing:3px;font-weight:700;color:var(--ink);text-transform:uppercase}
  .preview-body{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;padding:16px 32px 12px}
  .preview-body.preview-bedding{grid-template-columns:0.7fr 1.22fr 1.38fr}
  .pp-section{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--ink);text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--hairline)}
  .pp-intent{font-size:11px;font-style:italic;color:var(--body);line-height:1.4;margin-bottom:12px}
  .pp-intent.pp-intent--compact{font-size:9px;line-height:1.25;margin-bottom:8px;max-height:3.75em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3}
  .pp-specs{font-size:11px;color:var(--body);line-height:1.5}
  .pp-rendering{background:var(--field);border:1px dashed var(--border);min-height:200px;max-height:320px;height:260px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-style:italic;font-size:11px;overflow:hidden}
  .preview-body.preview-bedding .pp-rendering{min-height:180px;max-height:300px;height:220px}
  .pp-rendering img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center}
  .pp-fabric{margin-bottom:10px;display:grid;grid-template-columns:18px 64px 1fr;gap:6px}
  .pp-fabric.pp-fabric--compact{margin-bottom:8px;grid-template-columns:16px 58px 1fr;gap:5px}
  .pp-fabric .lt{font-family:Georgia;font-size:14px;font-weight:700;color:var(--ink)}
  .pp-fabric.pp-fabric--compact .lt{font-size:13px}
  .pp-fabric .sw{width:64px;height:64px;background:var(--field);border:1px solid var(--border);overflow:hidden}
  .pp-fabric.pp-fabric--compact .sw{width:58px;height:58px}
  .pp-fabric .sw img{width:100%;height:100%;object-fit:cover}
  .preview-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:0 32px 10px}
  .preview-page.preview-page--windows{height:auto;min-height:720px;padding-bottom:8px}
  .pp-diag-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;padding:4px 32px 10px;border-top:1px solid var(--hairline);align-items:stretch}
  .pp-diag-col{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pp-diag-col .pp-section{margin-bottom:2px}
  .pp-meas.pp-meas--in-diag{margin:0;max-height:200px;padding:6px 8px}
  .pp-diag-frame{border:1px solid var(--border);background:#fafbfd;min-height:140px;max-height:200px;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:9px;font-style:italic;text-align:center;padding:6px}
  .pp-diag-frame img{max-width:100%;max-height:198px;width:auto;height:auto;object-fit:contain}
  .strip-cell .ttl{font-size:10px;letter-spacing:2px;font-weight:700;color:var(--ink);text-transform:uppercase;margin-bottom:4px;padding-bottom:3px;border-bottom:1px solid var(--hairline)}
  .strip-cell .img{height:90px;background:var(--field);border:1px dashed var(--border);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:9.5px;font-style:italic}
  .strip-cell .img img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center}
  .pp-meas{font-size:10px;color:var(--body);padding:0 32px;display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
  .pp-meas .row{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:2px 0}
  .pp-meas.pp-meas--compact{font-size:8px;padding:6px 32px 8px;margin-bottom:8px;max-height:88px;overflow:auto;border:1px dashed var(--border);background:rgba(250,247,242,.85);grid-template-columns:1fr 1fr;gap:4px 10px}
  .pp-meas.pp-meas--compact .row{border-bottom:none;padding:1px 0;font-size:8px;line-height:1.25}
  .meas-compact-wrap{border:1px solid var(--hairline);background:var(--field);padding:0;margin-top:4px}
  .meas-compact-wrap > summary{font-size:10px;letter-spacing:1.2px;font-weight:700;color:var(--ink);text-transform:uppercase;padding:8px 10px;cursor:pointer;list-style:none;user-select:none}
  .meas-compact-wrap > summary::-webkit-details-marker{display:none}
  .meas-compact-wrap[open] > summary{border-bottom:1px solid var(--hairline)}
  .meas-compact-inner{padding:8px 10px 10px}
  .meas-compact-note{font-size:10px;color:var(--muted);line-height:1.35;margin-bottom:8px}
  .meas-compact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
  .meas-compact-grid .field{margin-bottom:0;gap:3px}
  .meas-compact-grid .field label{font-size:8px;letter-spacing:0.5px}
  .meas-compact-grid .field input{padding:5px 8px;font-size:12px}
  .preview-foot{padding:0 32px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .pp-notes-blk{font-size:10px;color:var(--body);line-height:1.4}
  .pp-notes-blk h4{font-size:9.5px;letter-spacing:2px;font-weight:700;margin:0 0 4px;color:var(--ink);text-transform:uppercase;padding-bottom:3px;border-bottom:1px solid var(--hairline)}
  .pp-notes-blk ul{margin:0;padding-left:14px}
  .pp-cch{
    position:absolute;right:24px;top:18px;text-align:right;padding:10px 14px 12px;
    background:linear-gradient(135deg,var(--cch-navy) 0%,var(--cch-navy-deep) 100%);
    border:1px solid rgba(196,164,100,.35);border-right:3px solid var(--cch-gold);border-radius:2px;
    box-shadow:0 2px 10px rgba(21,42,69,.2)
  }
  .pp-cch .b1{font-family:Georgia;font-size:18px;font-weight:700;color:#fff;letter-spacing:.5px}
  .pp-cch .b2{font-size:8px;color:rgba(196,164,100,.95);letter-spacing:3px;text-transform:uppercase}
  @media print {
    html, body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    @page { size: letter portrait; margin: 0.45in 0.5in; }
    .preview-shrink { transform: none !important; margin: 0 !important; }
    .preview-page {
      width: 100% !important;
      max-width: none !important;
      height: auto !important;
      min-height: 0 !important;
      margin: 0 !important;
      box-shadow: none !important;
      overflow: visible !important;
      page-break-after: auto;
    }
    .preview-page--windows { min-height: 0 !important; padding-bottom: 10px; }
    .preview-body { gap: 10px; padding: 12px 0; }
    .preview-body.preview-bedding .pp-rendering { min-height: 1.65in !important; max-height: 2.75in !important; height: 2.35in !important; }
    .pp-rendering { min-height: 1.75in; max-height: 2.75in; height: 2.5in; }
    .pp-rendering img { max-width: 100% !important; max-height: 100% !important; object-fit: contain !important; }
    .preview-strip { break-inside: avoid-page; page-break-inside: avoid; }
    .strip-cell .img { height: 0.95in; max-height: 100px; }
    .strip-cell .img img { object-fit: contain !important; }
    .pp-diag-row { break-inside: avoid-page; page-break-inside: avoid; }
    .pp-diag-col { break-inside: avoid-page; page-break-inside: avoid; }
    .pp-meas.pp-meas--compact,
    .pp-meas.pp-meas--in-diag { max-height: none !important; overflow: visible !important; }
    .pp-diag-frame { min-height: 1.1in; max-height: 1.85in; break-inside: avoid-page; page-break-inside: avoid; }
    .pp-diag-frame img { max-height: 1.75in !important; object-fit: contain !important; }
    .preview-foot { break-inside: avoid-page; page-break-inside: avoid; }
  }
  @media (max-width:1200px){
    .builder-shell{grid-template-columns:260px minmax(0,1fr)}
    .library-rail{width:260px;min-width:260px;max-width:260px}
  }
  @media (max-width:1100px){
    .builder-shell{grid-template-columns:1fr;grid-template-rows:minmax(130px,30vh) auto}
    main#app.builder-main{grid-template-columns:1fr;min-height:0}
    .library-rail{width:100%;min-width:0;max-width:none;border-right:none;border-bottom:3px solid var(--cch-gold);max-height:30vh}
    .form-pane{border-right:none}
    .preview-pane{display:none}
  }
</style>
</head>
<body>
<header>
  <div><h1>CCH Custom Order Builder</h1><div class="sub">Designing Your Story</div></div>
  <nav class="tabs" id="tabs">
    <button data-group="windows" class="active">Windows</button>
    <button data-group="upholstery">Upholstery</button>
    <button data-group="bedding">Bedding</button>
    <button data-cat="pillows">Pillows</button>
  </nav>
  <div class="auth-note" id="authNote">Checking sign-in...</div>
</header>

<!-- Shown only when not signed in (same email & password as CCH Studio). -->
<section id="builderAuthBar" style="display:block;background:#fff;border-bottom:1px solid var(--hairline);padding:14px 24px;">
  <div style="max-width:720px;margin:0 auto;">
    <div style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;">Sign in</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;">
      <div style="flex:1;min-width:180px;">
        <label style="font-size:10px;font-weight:700;color:#333;display:block;margin-bottom:4px;">Email</label>
        <input id="builderAuthEmailHeader" type="email" autocomplete="username" placeholder="you@cchdesign.com" style="width:100%;padding:10px 12px;border:1px solid var(--border);font-size:14px;box-sizing:border-box;" />
      </div>
      <div style="flex:1;min-width:140px;">
        <label style="font-size:10px;font-weight:700;color:#333;display:block;margin-bottom:4px;">Password</label>
        <input id="builderAuthPasswordHeader" type="password" autocomplete="current-password" style="width:100%;padding:10px 12px;border:1px solid var(--border);font-size:14px;box-sizing:border-box;" />
      </div>

function nextWorkOrderNumber(projectName, category, existingRows) {

    if (!wo.startsWith(prefix)) return;

function el(tag, attrs = {}, ...children) {

    if (k === "class") e.className = v;
    else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on") && typeof v === "function") e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  });
  children.flat().forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

const libraryFolderListCache = {};
function clearLibraryFolderCachesFor(libKey) {
  Object.keys(libraryFolderListCache).forEach(k => {
    if (k.startsWith(libKey + "::")) delete libraryFolderListCache[k];
  });
  delete state.libraryCache[libKey];
}
async function listLibraryFolder(libKey, subPath) {
  const meta = LIBRARY[libKey];
  if (!meta) return { files: [], folders: [] };
  const clean = String(subPath || "").replace(/^\/+|\/+$/g, "");
  const cacheKey = libKey + "::" + clean;
  if (libraryFolderListCache[cacheKey]) return libraryFolderListCache[cacheKey];
  const basePath = "library/" + meta.folder + (clean ? "/" + clean : "");
  const ref = storage.ref(basePath);
  try {
    const list = await ref.listAll();
    const files = await Promise.all(list.items.map(async item => ({
      id: item.fullPath,
      path: item.fullPath,
      label: item.name.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "),
      filename: item.name,
      downloadURL: await item.getDownloadURL()
    })));
    const folders = (list.prefixes || []).map(pref => {
      const fp = pref.fullPath || "";
      const segs = fp.split("/").filter(Boolean);
      const name = segs[segs.length - 1] || fp;
      return { name, fullPath: fp.replace(/\/$/, "") };
    });
    const result = { files, folders };
    libraryFolderListCache[cacheKey] = result;
    return result;
  } catch (e) {
    console.warn("Library folder list failed", libKey, clean, e);
    return { files: [], folders: [] };
  }
}
async function ensureLibrary(category) {
  if (state.libraryCache[category]) return state.libraryCache[category];
  const { files } = await listLibraryFolder(category, "");
  state.libraryCache[category] = files;
  return files;
}
async function uploadImageToLibraryFolder(libKey, subPath, file) {
  const meta = LIBRARY[libKey];
  if (!meta || !file) return null;
  const clean = String(subPath || "").replace(/^\/+|\/+$/g, "");
  const basePath = "library/" + meta.folder + (clean ? "/" + clean : "");
  const safe = Date.now() + "_" + String(file.name || "image.jpg").replace(/[^\w.\-]/g, "_");
  const ref = storage.ref(basePath + "/" + safe);
  await ref.put(file, { contentType: file.type || "image/jpeg" });
  clearLibraryFolderCachesFor(libKey);
  return {
    path: ref.fullPath,
    label: safe.replace(/\.[^.]+$/, "").replace(/[_-]+/g, " "),
    downloadURL: await ref.getDownloadURL()
  };
}

/**
 * Project rooms: board.rooms (array or legacy object map) + roomMeta + clip.room,
 * plus roomBoards / rooms subcollections. Names are whitespace-normalized, deduped case-insensitively,
 * capped at 200 characters (Studio has no cap; long descriptive room names were previously dropped at 40).
 */
async function loadProjectRooms(projectId) {
  if (!projectId) { state.projectRooms = []; return; }
  const orderedNames = [];
  const seen = new Set();
  const MAX_ROOM_NAME = 200;
  function normRoomStr(raw) {
    return String(raw || "").replace(/\s+/g, " ").trim();
  }
  function pushRoomName(raw) {
    const name = normRoomStr(raw);
    if (!name || name.length > MAX_ROOM_NAME) return;
    const key = name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    orderedNames.push(name);
  }
  function roomFromBoardEntry(r) {
    if (typeof r === "string") return r;
    if (r && typeof r === "object") {
      return r.name || r.displayName || r.roomName || r.room || r.title || r.label || "";
    }
    return "";
  }
  try {
    const boardRef = db.collection("boards").doc(projectId);
    const boardDoc = await boardRef.get();
    const bx = boardDoc.exists ? boardDoc.data() || {} : {};
    const br = bx.rooms;
    if (Array.isArray(br)) {
      br.forEach(r => pushRoomName(roomFromBoardEntry(r)));
    } else if (br && typeof br === "object") {
      Object.keys(br).forEach(k => pushRoomName(roomFromBoardEntry(br[k])));
    }

    try {
      const rmSnap = await boardRef.collection("roomMeta").get();
      rmSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.roomName || x.room || x.title || x.label);
      });
    } catch (eRm) { console.warn("[Builder] roomMeta", eRm); }

    try {
      const rbSnap = await boardRef.collection("roomBoards").limit(500).get();
      rbSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.room || x.roomName || x.title || x.label || d.id);
      });
    } catch (eRb) {}

    try {
      const roomsSnap = await boardRef.collection("rooms").limit(500).get();
      roomsSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.room || x.roomName || x.title || x.label || d.id);
      });
    } catch (eR) {}

    let lastClip = null;
    const clipPage = 500;
    for (let guard = 0; guard < 80; guard++) {
      let q = boardRef.collection("clips").limit(clipPage);
      if (lastClip) q = q.startAfter(lastClip);
      const clipSnap = await q.get();
      if (clipSnap.empty) break;
      clipSnap.forEach(d => {
        const cr = normRoomStr((d.data() || {}).room);
        if (cr) pushRoomName(cr);
      });
      if (clipSnap.docs.length < clipPage) break;
      lastClip = clipSnap.docs[clipSnap.docs.length - 1];
    }

    orderedNames.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    state.projectRooms = orderedNames.map((name, i) => {
      const slug = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "r";
      return { id: "room:" + i + ":" + slug, name };
    });
  } catch (e) {
    console.warn("[Builder] loadProjectRooms", e);
    state.projectRooms = [];
  }
}

function autoPickForSpec(cat, specId, specValue) {
  const cfg = CATS[cat];
  if (!cfg || !cfg.pickers) return;
  const v = String(specValue || "").toLowerCase();
  function pickBy(pickerId, keywordRegex) {
    const picker = cfg.pickers.find(p => p.id === pickerId);
    if (!picker) return;
    const rows = state.libraryCache[picker.category] || [];
    if (!rows.length) return;
    const hit = rows.find(r => keywordRegex.test(String(r.label || "") + " " + String(r.filename || "")));
    if (hit) {
      if (!state.pickers[cat]) state.pickers[cat] = {};
      state.pickers[cat][pickerId] = { category: picker.category, storagePath: hit.path, path: hit.path, label: hit.label, downloadURL: hit.downloadURL };
    }
  }
  if (cat === "flatfold" && specId === "operation") {
    if (/continuous|chain/.test(v)) {
      pickBy("hardware", /(bronze|continuous|chain)/i);
    }
  }
  if (cat === "flatfold" && (specId === "function" || specId === "operation" || specId === "mount")) {
    pickBy("fold", /(flat\s*fold|flatfold)/i);
  }
  if (cat === "roller" && specId === "operation") {
    if (/continuous|chain/.test(v)) {
      pickBy("hardware", /(bronze|continuous|chain)/i);
    }
  }
  if (cat === "roller" && (specId === "function" || specId === "operation" || specId === "mount")) {
    pickBy("face", /(roller|shade|solar|woven|blackout)/i);
  }
}

function mergeFirestoreDocIntoProductMap(map, doc) {

/**
 * Studio keeps master rows in `products` and richer copies in `productLibrary` — merge by doc id (same as main app).
 * Paginates so large catalogs (2000+) are not capped at a single limit().
 */
async function loadProductLibrary() {
  const mergeMap = {};
  const batchSize = 500;
  const maxBatchesPerCollection = 120;
  try {
    let lastP = null;
    let lastL = null;
    let batchNum = 0;

    const snapP0 = await db.collection("products").limit(batchSize).get();
    snapP0.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
    lastP = snapP0.docs.length === batchSize ? snapP0.docs[snapP0.docs.length - 1] : null;

    try {
      const snapL0 = await db.collection("productLibrary").limit(batchSize).get();
      snapL0.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
      lastL = snapL0.docs.length === batchSize ? snapL0.docs[snapL0.docs.length - 1] : null;
    } catch (eLib) {
      lastL = null;
    }

    while ((lastP || lastL) && batchNum < maxBatchesPerCollection) {
      batchNum++;
      if (lastP) {
        const snap = await db.collection("products").startAfter(lastP).limit(batchSize).get();
        snap.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
        lastP = snap.docs.length === batchSize ? snap.docs[snap.docs.length - 1] : null;
      }
      if (lastL) {
        try {
          const snap = await db.collection("productLibrary").startAfter(lastL).limit(batchSize).get();
          snap.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
          lastL = snap.docs.length === batchSize ? snap.docs[snap.docs.length - 1] : null;
        } catch (e2) {
          lastL = null;
        }
      }
    }

    state.productLibrary = Object.values(mergeMap).map(row => {
      normalizeBuilderLibraryRow(row);
      return row;
    });
  } catch (e) {
    console.warn("[Builder] loadProductLibrary", e);
    state.productLibrary = [];
  }
}

function productLinkedToProject(p, projectId) {

/** Studio Product Library bucket “Fabric & Trim” only (not Window Coverings, Bedding & Pillows, etc.). */
function categoryIsFabricTrimCatalog(cat) {
  const t = String(cat || "").trim().toLowerCase().replace(/\s+/g, " ");
  if (!t) return false;
  if (t === "fabric" || t === "fabri") return true;
  if (t === "fabric & trim" || t === "fabric + trim") return true;
  if (t.includes("fabric") && t.includes("trim")) return true;
  return false;
}
/** Studio-style category: fabric/trim vs hardware for project + catalog picks (broad). */
function categoryMatchesFabricMaterial(cat) {
  const s = String(cat || "").trim().toLowerCase();
  if (!s) return false;
  if (/\bhardware\b/.test(s) && !/fabric|trim/.test(s)) return false;
  return /fabric|trim|textile|upholstery|bedding|pillow|window|covering|drapery|roman|roller|shade|sheer|linen|wall covering|custom furniture|custom upholstery|custom window/i.test(s);
}
function categoryMatchesHardwareMaterial(cat) {
  const s = String(cat || "").trim().toLowerCase();
  if (!s) return false;
  return /\bhardware\b/.test(s) || /^lighting$/i.test(s) || /appliances?\s*&\s*plumbing/i.test(s);
}
function getProductLibraryPickMode(pickerConfig) {
  const id = String((pickerConfig && pickerConfig.id) || "").toLowerCase();
  if (id === "hardware") return "hardware";
  return "fabric";
}
function materialMatchesMode(category, mode) {
  if (mode === "hardware") return categoryMatchesHardwareMaterial(category);
  return categoryMatchesFabricMaterial(category);
}
/**
 * Project clips (this board) + products linked to the project first, then catalog.
 * mode: "fabric" | "hardware"
 * opts.fabricTrimCatalogOnly — fabric mode only: restrict catalog/clips to Studio “Fabric & Trim” bucket.
 */
function buildMaterialPickList(projectId, mode, opts) {
  const fabricTrimOnly = !!(opts && opts.fabricTrimCatalogOnly);
  const out = [];
  const seen = new Set();
  function dedupePush(row, key) {
    if (!row || !row.imageUrl || seen.has(key)) return;
    seen.add(key);
    out.push(row);
  }
  function productPassesMode(p) {
    if (mode === "hardware") return categoryMatchesHardwareMaterial(p.category);
    if (fabricTrimOnly) return categoryIsFabricTrimCatalog(p.category);
    return categoryMatchesFabricMaterial(p.category);
  }
  function clipPassesMode(catStr) {
    if (mode === "hardware") return catStr ? materialMatchesMode(catStr, mode) : false;
    if (!fabricTrimOnly) return catStr ? materialMatchesMode(catStr, mode) : true;
    if (!catStr) return true;
    return categoryIsFabricTrimCatalog(catStr);
  }
  if (projectId) {
    (state.inspirationItems || []).forEach(i => {
      const cat = i.category || "";
      if (!clipPassesMode(cat)) return;
      dedupePush({
        id: "clip:" + i.id,
        title: i.title,
        name: i.title,
        imageUrl: i.imageUrl,
        vendor: i.vendor,
        sku: i.sku,
        width: i.width,
        repeat: i.repeat,
        materials: i.materials,
        category: cat,
        _fromProject: true
      }, "clip:" + i.id);
    });
    (state.productLibrary || []).forEach(p => {
      if (!p || !p.imageUrl || !productLinkedToProject(p, projectId)) return;
      if (!productPassesMode(p)) return;
      dedupePush(Object.assign({ _fromProject: true }, p), "projprod:" + p.id);
    });
  }
  (state.productLibrary || []).forEach(p => {
    if (!p || !p.imageUrl || seen.has("prod:" + p.id)) return;
    if (!productPassesMode(p)) return;
    if (projectId && productLinkedToProject(p, projectId)) return;
    dedupePush(Object.assign({ _fromProject: false }, p), "prod:" + p.id);
  });
  return out;
}
function resolveMaterialProductById(id) {
  const sid = String(id || "");
  if (sid.startsWith("clip:")) {
    const cid = sid.slice(5);
    const i = (state.inspirationItems || []).find(x => x.id === cid);
    if (!i) return null;
    return {
      id: sid,
      title: i.title,
      name: i.title,
      imageUrl: i.imageUrl,
      vendor: i.vendor || "",
      manufacturer: "",
      sku: i.sku || "",
      width: i.width || "",
      repeat: i.repeat || "",
      materials: i.materials || "",
      category: i.category || "clip",
      _clip: true
    };
  }
  return (state.productLibrary || []).find(x => x.id === id) || null;
}

async function saveWorkOrder(isNewRevision) {
  const cat = state.category;
  const data = getCatData(cat);
  const projectId = (data.projectId || "").trim();

  if (!String(data.location || "").trim()) { alert("Room is required."); return; }
  await uploadPendingAssets(cat, projectId);
  const col = db.collection("boards").doc(projectId).collection("workOrders");
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const existingId = state.currentWorkOrderId && !isNewRevision ? state.currentWorkOrderId : "";
  const docRef = existingId ? col.doc(existingId) : col.doc();
  if (!data.workOrder) {
    data.workOrder = nextWorkOrderNumber(data.project, cat, state.workOrdersByProject);
  }
  const conflicting = (state.workOrdersByProject || []).find(x =>
    x.id !== existingId && String(x.workOrderNumber || "").toUpperCase() === String(data.workOrder || "").toUpperCase()
  );
  if (conflicting) {
    data.workOrder = nextWorkOrderNumber(data.project, cat, state.workOrdersByProject);
  }
  const payload = {
    category: cat,
    projectId,
    projectName: data.project || "",
    address: data.address || "",
    workroomId: data.workroomId || "",
    workroomName: data.workroomName || "",
    workOrderNumber: data.workOrder || "",
    location: data.location || "",
    designIntent: data.designIntent || "",
    treatmentOptions: data.treatmentOptions || [],
    trimOptions: data.trimOptions || [],
    detailSelections: data.detailSelections || {},
    extraFabricRoles: data.extraFabricRoles || [],
    specs: data.specs || {},
    fabrics: data.fabrics || {},
    measurements: data.measurements || {},
    pickerSelections: state.pickers[cat] || {},
    notes: data.notes || [],
    fabNotes: data.fabNotes || [],
    renderingUrl: data.renderingUrl || "",
    detailSketchUrl: data.detailSketchUrl || "",
    elevationUrl: data.elevationUrl || "",
    sectionViewUrl: data.sectionViewUrl || "",
    specAttachments: data.specAttachments || {},
    swatchUrls: data.swatchUrls || {},
    revision: Number(data.revision || 1),
    updatedAt: now,
    createdAt: existingId ? (data.createdAt || now) : now
  };
  await docRef.set(payload, { merge:true });
  state.currentWorkOrderId = docRef.id;
  if (!existingId) data.revision = 1;
  if (isNewRevision) data.revision = Number(data.revision || 1) + 1;

async function duplicateWorkOrderFromFirestore(projectId, sourceDocId) {
  const snap = await db.collection("boards").doc(projectId).collection("workOrders").doc(sourceDocId).get();
  if (!snap.exists) return;
  const row = snap.data();
  const cat = row.category || state.category;
  state.category = cat;
  state.uiGroup = currentGroupFromCategory(cat);
  document.querySelectorAll("#tabs button").forEach(b => {
    const grp = b.dataset.group || (b.dataset.cat ? currentGroupFromCategory(b.dataset.cat) : "windows");
    b.classList.toggle("active", grp === state.uiGroup);
  });
  state.currentWorkOrderId = "";
  state.data[cat] = { ...defaultData(cat), ...row };
  const d = state.data[cat];
  if (!d.workOrder && d.workOrderNumber) d.workOrder = d.workOrderNumber;
  state.pickers[cat] = JSON.parse(JSON.stringify(row.pickerSelections || {}));
  state.uploads[cat] = {};
  state.uploadFiles[cat] = {};
  const chosen = state.projects.find(p => p.id === projectId);
  if (chosen) {
    d.projectId = projectId;
    d.project = chosen.name || chosen.id || "";
    d.address = chosen.address || "";
  }
  d.revision = 1;
  d.date = new Date().toLocaleDateString("en-US");
  d.workOrder = nextWorkOrderNumber(d.project, cat, state.workOrdersByProject || []);
  if (state.libraryRail) state.libraryRail.userPickedFolder = false;
}

async function applyBuilderQueryParams() {
  const params = new URLSearchParams(window.location.search);
  const projectId = (params.get("projectId") || params.get("project") || "").trim();
  const workOrderId = (params.get("workOrderId") || params.get("wo") || "").trim();
  const duplicateFrom = (params.get("duplicateFrom") || "").trim();
  if (!projectId) return;
  const chosen = state.projects.find(p => p.id === projectId);
  if (!chosen) return;
  state.currentWorkOrderId = "";
  Object.keys(CATS).forEach(catId => applySelectedProjectToCategory(catId, chosen));
  state.workOrdersByProject = await listWorkOrders(projectId);
  const d0 = getCatData(state.category);
  d0.projectId = projectId;
  d0.project = chosen.name || chosen.id || "";
  d0.address = chosen.address || "";
  await loadProjectRooms(projectId);
  await loadInspirationItems(projectId);
  if (duplicateFrom) {
    await duplicateWorkOrderFromFirestore(projectId, duplicateFrom);
  } else if (workOrderId) {
    await loadWorkOrderById(workOrderId);
  }
  if (typeof history.replaceState === "function") {
    try {
      const u = new URL(window.location.href);
      u.search = "";
      history.replaceState({}, "", u.pathname + u.hash);
    } catch (e) {}
  }
}

function buildUpload(cat, key, hint) {
  const wrap = el("div", { class:"upload-box" });
  const cur = state.uploads[cat] && state.uploads[cat][key];
  function clearStoredValue() {
    const gd = getCatData(cat);
    if (key === "rendering") gd.renderingUrl = "";
    else if (key === "detail") gd.detailSketchUrl = "";
    else if (key === "elevation") gd.elevationUrl = "";
    else if (key === "sectionView") gd.sectionViewUrl = "";
    else if (gd.swatchUrls && gd.swatchUrls[key]) delete gd.swatchUrls[key];
  }
  if (cur) {
    wrap.classList.add("has-img");
    wrap.append(el("img", { src: cur }));
    wrap.append(el("div", { style:"padding:4px 8px;font-size:10px" }, el("a", { href:"#", class:"clear", onclick: e => {
      e.preventDefault();
      delete state.uploads[cat][key];
      delete state.uploadFiles[cat][key];
      clearStoredValue();
      renderForm();
    }}, "Remove")));
  } else {
    const gd = getCatData(cat);
    const existing = key === "rendering" ? (gd.renderingUrl || "")
      : key === "detail" ? (gd.detailSketchUrl || "")
      : key === "elevation" ? (gd.elevationUrl || "")
      : key === "sectionView" ? (gd.sectionViewUrl || "")
      : ((gd.swatchUrls || {})[key] || "");
    if (existing) {
      wrap.classList.add("has-img");
      wrap.append(el("img", { src: existing }));
      wrap.append(el("div", { style:"padding:4px 8px;font-size:10px" }, el("a", { href:"#", class:"clear", onclick: e => {
        e.preventDefault();
        clearStoredValue();
        renderForm();
      }}, "Remove")));
    } else {
      wrap.append(el("div", {}, hint));
    }
  }
  wrap.addEventListener("click", () => {
    const inp = el("input", { type:"file", accept:"image/*" });
    inp.addEventListener("change", e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        state.uploads[cat][key] = ev.target.result;
        state.uploadFiles[cat][key] = f;
        updatePreview();
        renderForm();
      };
      r.readAsDataURL(f);
    });
    inp.click();
  });
  return wrap;
}

async function uploadPendingAssets(cat, projectId) {
  const d = getCatData(cat);
  const files = state.uploadFiles[cat] || {};
  const keys = Object.keys(files);
  for (const key of keys) {
    const file = files[key];
    const workOrderId = state.currentWorkOrderId || "draft";
    const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
    let dest;
    if (key === "rendering") {
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/rendering/" + Date.now() + "-" + key + "." + ext;
    } else if (key === "detail") {
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/details/" + Date.now() + "-detail." + ext;
    } else if (key === "elevation") {
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/elevations/" + Date.now() + "-elevation." + ext;
    } else if (key === "sectionView") {
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/sections/" + Date.now() + "-section." + ext;
    } else if (key.indexOf("picker_") === 0) {
      const pid = key.slice(7);
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/picker_uploads/" + pid + "/" + Date.now() + "-ref." + ext;
    } else if (key.indexOf("specAttach_") === 0) {
      const sid = key.slice(11);
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/spec_refs/" + sid + "/" + Date.now() + "-img." + ext;
    } else {
      dest = "boards/" + projectId + "/workOrders/" + workOrderId + "/swatches/" + Date.now() + "-" + key + "." + ext;
    }
    const ref = storage.ref(dest);
    await ref.put(file, { contentType: file.type || "image/jpeg" });
    const url = await ref.getDownloadURL();
    if (key === "rendering") d.renderingUrl = url;
    else if (key === "detail") d.detailSketchUrl = url;
    else if (key === "elevation") d.elevationUrl = url;
    else if (key === "sectionView") d.sectionViewUrl = url;
    else if (key.indexOf("picker_") === 0) {
      const pid = key.slice(7);
      if (!state.pickers[cat]) state.pickers[cat] = {};
      state.pickers[cat][pid] = {
        category: "upload",
        storagePath: dest,
        path: dest,
        label: "Uploaded reference",
        downloadURL: url
      };
      delete state.uploads[cat][key];
    } else if (key.indexOf("specAttach_") === 0) {
      const sid = key.slice(11);
      if (!d.specAttachments) d.specAttachments = {};
      d.specAttachments[sid] = {
        path: dest,
        storagePath: dest,
        label: "Uploaded",
        downloadURL: url
      };
      delete state.uploads[cat][key];
    } else {
      if (!d.swatchUrls) d.swatchUrls = {};
      d.swatchUrls[key] = url;
    }
  }
  state.uploadFiles[cat] = {};
}

function suggestedLibraryKeyForCategory(cat) {
  const cfg = CATS[cat] || { pickers: [] };
  const pickers = cfg.pickers || [];
  const lr = state.libraryRail;
  if (lr && lr.targetPickerId) {
    const picked = pickers.find(p => p.id === lr.targetPickerId);
    if (picked && picked.category && LIBRARY[picked.category]) return picked.category;
  }
  const first = pickers[0];
  if (first && first.category && LIBRARY[first.category]) return first.category;
  return "windows";
}

function syncLibraryRailToTemplateIfAllowed() {

      const appliesHere = (cfg.pickers || []).some(p => p.id === lr.targetPickerId && p.category === lr.libKey);
      if (row && appliesHere) {
        setPickerSelection(cat, lr.targetPickerId, {
          category: lr.libKey,
          storagePath: row.path,
          path: row.path,
          label: row.label,
          downloadURL: row.downloadURL
        });
      }
      await renderLibraryRail();
      renderForm();
    } catch (err) {
      alert("Upload failed: " + (err && err.message ? err.message : err));
    }
  });
  const actions = el("div", { class:"lib-rail-actions" });
  actions.append(
    el("button", {
      type: "button",
      class: "btn-upload",
      onclick: () => upInp.click()
    }, "Upload image to this folder"),
    el("button", {

      onclick: async () => {
        clearLibraryFolderCachesFor(lr.libKey);
        delete state.libraryCache[lr.libKey];
        await renderLibraryRail();
      }
    }, "Refresh list"),
    upInp
  );
  inner.append(actions);
  rail.append(inner);
}

    .concat((d.trimOptions && d.trimOptions.length) ? ["Trim: " + d.trimOptions.join(", ")] : [])

    .concat((d.detailSelections && d.detailSelections.nailheads && d.detailSelections.nailheads.label) ? ["Nailheads: " + d.detailSelections.nailheads.label] : [])
    .concat((d.detailSelections && d.detailSelections.feet && d.detailSelections.feet.label) ? ["Feet/Legs: " + d.detailSelections.feet.label] : []);
  const intentAndLayers = (d.designIntent || "") + (detailsLine.length ? ("\n\n" + detailsLine.join("\n")) : "");
  s.addText(intentAndLayers, { x:0.5, y:1.55, w:2.9, h:1.05, fontSize:8.5, italic:true });
  const renderData = state.uploads[cat] && state.uploads[cat].rendering ? state.uploads[cat].rendering : await urlToDataUri(d.renderingUrl);
  if (renderData) s.addImage({ data: renderData, x:3.65, y:1.3, w:6.0, h:2.4, sizing:{ type:"contain", w:6.0, h:2.4 } });
  let sy = 4.0;
  for (let i = 0; i < Math.min(4, cfg.pickers.length); i++) {
    const p = cfg.pickers[i];
    const sel = pks[p.id];
    if (!sel || !sel.downloadURL) continue;
    if (i === 3 && (state.uploads[cat] && state.uploads[cat].custom4 || ((d.swatchUrls || {}).custom4 || ""))) continue;
    const dataUri = await urlToDataUri(sel.downloadURL);
    if (dataUri) s.addImage({ data:dataUri, x:0.5 + i*3.1, y:sy, w:2.95, h:1.05, sizing:{ type:"contain", w:2.95, h:1.05 } });
  }
  const custom4 = (state.uploads[cat] && state.uploads[cat].custom4) || ((d.swatchUrls || {}).custom4 || "");
  if (custom4) {
    const custom4Data = custom4.startsWith("data:") ? custom4 : await urlToDataUri(custom4);
    if (custom4Data) s.addImage({ data:custom4Data, x:0.5 + 3*3.1, y:sy, w:2.95, h:1.05, sizing:{ type:"contain", w:2.95, h:1.05 } });
  }
  if (isWindowTreatmentCategory(cat)) {
    const elevData = (state.uploads[cat] && state.uploads[cat].elevation) || await urlToDataUri(d.elevationUrl);
    const secData = (state.uploads[cat] && state.uploads[cat].sectionView) || await urlToDataUri(d.sectionViewUrl);
    s.addText("ELEVATION (FRONT)", { x:0.5, y:5.12, w:6.2, h:0.18, fontSize:8, bold:true });
    s.addText("SECTION VIEW", { x:6.85, y:5.12, w:6.2, h:0.18, fontSize:8, bold:true });
    if (elevData) s.addImage({ data:elevData, x:0.5, y:5.32, w:6.1, h:1.85, sizing:{ type:"contain", w:6.1, h:1.85 } });
    if (secData) s.addImage({ data:secData, x:6.85, y:5.32, w:6.1, h:1.85, sizing:{ type:"contain", w:6.1, h:1.85 } });
  }
  const fname = "CCH_" + tTitle.replace(/\W+/g, "_") + "_" + (d.workOrder || "WO") + "_" + (d.project || "Project").replace(/\W+/g, "_") + ".pptx";
  try {
    const blob = await pres.write({ outputType:"blob" });
    await saveExportBlob(blob, fname);
    const href = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = href;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 1000);
  } catch (e) {
    console.warn("Blob export fallback", e);
    await pres.writeFile({ fileName: fname });
  }
}

async function saveExportBlob(blob, fname) {
  const cat = state.category;
  const d = getCatData(cat);
  const projectId = (d.projectId || "").trim();
  if (!projectId || !state.currentWorkOrderId || !blob) return;
  const path = "boards/" + projectId + "/workOrders/" + state.currentWorkOrderId + "/exports/" + Date.now() + "-" + fname;
  const ref = storage.ref(path);
  await ref.put(blob, { contentType:"application/vnd.openxmlformats-officedocument.presentationml.presentation" });
  const url = await ref.getDownloadURL();
  await db.collection("boards").doc(projectId).collection("workOrders").doc(state.currentWorkOrderId).set({
    exportPptxUrl: url,
    exportPptxPath: path,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
}

async function urlToDataUri(url) {
  if (!url) return "";
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = e => res(e.target.result);
      fr.readAsDataURL(blob);
    });
  } catch (e) { return ""; }
}

document.getElementById("tabs").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  const group = e.target.dataset.group || (e.target.dataset.cat ? currentGroupFromCategory(e.target.dataset.cat) : "windows");
  state.uiGroup = group;
  if (group === "windows") {
    if (!["style", "drapery", "roman", "flatfold", "roller"].includes(state.category)) state.category = "style";
  } else if (group === "upholstery") {
    state.category = "upholstery";
  } else if (group === "bedding") {
    state.category = "bedding";
  } else {
    state.category = "pillows";
  }
  // Switching template should not carry an old selected work-order context.
  state.currentWorkOrderId = "";
  if (state.libraryRail) state.libraryRail.userPickedFolder = false;
  const d = getCatData(state.category);
  if (d.projectId) d.workOrder = nextWorkOrderNumber(d.project, state.category, state.workOrdersByProject);
  const _cfg = CATS[state.category];
  const _first = _cfg && _cfg.pickers && _cfg.pickers[0];
  if (_first && state.libraryRail) {
    state.libraryRail.segments = [];
    if (!state.libraryRail.targetPickerId) state.libraryRail.targetPickerId = _first.id;
  }
  renderForm();
});

auth.onAuthStateChanged(async user => {
  const note = document.getElementById("authNote");
  const authBar = document.getElementById("builderAuthBar");

  if (!user) {
    note.textContent = "Not signed in";
    if (authBar) authBar.style.display = "block";
    return;
  }
  state.currentUser = user;
  note.textContent = (user.email || user.uid || "").trim() || "Signed in";
  if (authBar) authBar.style.display = "none";
  const shell = document.getElementById("builderShell");
  if (shell) shell.style.display = "grid";
  document.getElementById("app").style.display = "grid";
  state.uiGroup = currentGroupFromCategory(state.category);
  document.querySelectorAll("#tabs button").forEach(b => {
    const grp = b.dataset.group || (b.dataset.cat ? currentGroupFromCategory(b.dataset.cat) : "windows");
    b.classList.toggle("active", grp === state.uiGroup);
  });
  await loadProjects();
  await loadWorkrooms();
  await loadProductLibrary();
  await loadInspirationItems(getCatData(state.category).projectId || "");
  await applyBuilderQueryParams();
  await renderForm();
});
</script>
</body>
</html>
