<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CCH Custom Order Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/gh/gitbrent/PptxGenJS@v3.12.0/dist/pptxgen.bundle.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>
<style>
  :root{
    --ink:#1A1A1A; --body:#333; --muted:#888; --rule:#999; --hairline:#DDD;
    --accent:#C4A464; --bg:#f5f7fa; --field:#fafbfc; --border:#cfd6e0;
    --flag:#B8782F; --selected:#1A1A1A;
    --cch-navy:#1B3352; --cch-navy-deep:#152a45; --cch-gold:#C4A464;
    --rail-text:rgba(255,255,255,.92); --rail-muted:rgba(255,255,255,.58);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;font-family:Calibri,Arial,sans-serif;color:var(--body);background:#eef1f6}
  button{font-family:inherit;cursor:pointer}
  header{background:#fff;border-bottom:1px solid var(--hairline);padding:14px 24px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;row-gap:10px}
  header h1{margin:0;font-family:Georgia,serif;font-size:22px;color:var(--ink);font-weight:700}
  header .sub{font-size:11px;letter-spacing:3px;color:var(--muted);text-transform:uppercase}
  .auth-note{font-size:11px;color:#555}
  .header-save-bar{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
  .header-save-bar .btn{padding:9px 20px;font-size:11px;letter-spacing:2px}
  .form-save-toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;background:var(--field);border:1px solid var(--hairline);position:sticky;top:0;z-index:8;flex-wrap:wrap}
  .form-save-toolbar .form-save-wo{font-weight:700;font-size:12px;color:var(--ink);letter-spacing:.5px}
  .form-save-toolbar .form-save-hint{font-size:11px;color:var(--muted);flex:1;min-width:140px}
  .header-save-bar .btn:disabled{opacity:.55;cursor:not-allowed}
  .header-wo-status{font-size:11px;color:var(--muted);letter-spacing:.3px;max-width:min(280px,42vw)}
  .header-save-status{font-size:11px;color:var(--flag);font-weight:600;letter-spacing:.5px}
  .header-builder-preview-btns{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin-left:8px;position:relative;z-index:6}
  .header-builder-preview-btns .btn.secondary{padding:7px 12px;font-size:10px;letter-spacing:1px}
  body.builder-signed-in .header-builder-preview-btns{display:none}
  .header-library-toggle{display:none;align-items:center;gap:8px;margin-left:8px;flex-wrap:wrap}
  .header-library-toggle .btn.secondary{padding:7px 12px;font-size:10px;letter-spacing:1px}
  body.builder-signed-in .header-library-toggle{display:flex}
  nav.tabs{display:flex;gap:0}
  nav.tabs button{background:transparent;border:none;padding:10px 18px;font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;border-bottom:2px solid transparent}
  nav.tabs button.active{color:var(--cch-navy);border-bottom-color:var(--cch-gold);font-weight:700}
  .builder-shell{display:grid;grid-template-columns:280px minmax(0,1fr);width:100%;min-height:calc(100vh - 64px);align-items:stretch;background:var(--bg)}
  .builder-shell.library-rail-hidden{grid-template-columns:minmax(0,1fr)!important}
  .builder-shell.library-rail-hidden .library-rail{display:none!important}
  .builder-shell .library-rail{align-self:stretch}
  main#app.builder-main{display:grid;grid-template-columns:minmax(300px,1.1fr) minmax(240px,0.9fr);gap:0;min-width:0;min-height:calc(100vh - 64px)}
  .builder-shell.preview-only{grid-template-columns:minmax(0,1fr)!important}
  .builder-shell.preview-only .library-rail{display:none!important}
  .builder-shell.preview-only #app.builder-main{grid-template-columns:1fr!important;min-height:calc(100vh - 64px)}
  .builder-shell.preview-only .form-pane{display:none!important}
  .builder-shell.preview-only .preview-pane{max-width:100%;padding:16px 20px 32px}
  .builder-shell.preview-only .preview-shrink{transform:none;margin-bottom:0}
  /* Stacking: .preview-shrink uses transform:scale(), which creates a stacking context and paints
     after this toolbar — without z-index, "Preview only" / "Show form & library" clicks hit the preview. */
  .preview-view-toolbar{position:relative;z-index:6;display:flex;justify-content:flex-end;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .preview-view-toolbar .btn.secondary{padding:8px 12px;font-size:10px;letter-spacing:1px}
  .preview-shrink{position:relative;z-index:0}
  /* !important: survives stale caches / extensions overriding aside backgrounds */
  /* Rail: overflow visible so native <select> lists are not clipped; scroll only the inner panel. */
  .library-rail,#libraryRail.library-rail{
    position:relative;
    z-index:4;
    background-color:var(--cch-navy-deep)!important;
    background-image:linear-gradient(180deg,var(--cch-navy) 0%,var(--cch-navy-deep) 100%)!important;
    border-right:3px solid var(--cch-gold);overflow:visible;padding:12px 10px 80px;display:flex;flex-direction:column;gap:8px;width:280px;min-width:280px;max-width:280px;box-sizing:border-box;flex-shrink:0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    min-height:calc(100vh - 64px);
  }
  .library-rail > .library-rail-inner{
    flex:1;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    -webkit-overflow-scrolling:touch;
    padding-right:2px;
    scrollbar-color:rgba(255,255,255,.28) rgba(0,0,0,.2);
    scrollbar-width:thin
  }
  .library-rail > .library-rail-inner::-webkit-scrollbar{width:10px}
  .library-rail > .library-rail-inner::-webkit-scrollbar-track{background:rgba(0,0,0,.18)}
  .library-rail > .library-rail-inner::-webkit-scrollbar-thumb{background:rgba(255,255,255,.22);border-radius:5px;border:2px solid transparent;background-clip:padding-box}
  .library-rail .btn.secondary{
    background:rgba(255,255,255,.1)!important;color:var(--rail-text)!important;
    border:1px solid rgba(255,255,255,.22)!important
  }
  .library-rail-boot h3{margin:0 0 6px;font-size:12px;letter-spacing:2px;color:var(--rail-text)}
  .library-rail h3{margin:0;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--rail-text);font-weight:700}
  .library-rail .sub{font-size:10px;color:var(--rail-muted);line-height:1.35;margin-bottom:4px}
  .library-rail-boot p{color:var(--rail-muted);font-size:11px;line-height:1.45;margin:0}
  .library-rail-boot code{font-size:10px;background:rgba(0,0,0,.25);color:var(--rail-text);padding:1px 5px;border-radius:2px}
  .lib-rail-select,.lib-rail-filter{width:100%;font-size:12px;padding:6px 8px;border:1px solid rgba(196,164,100,.35);background:rgba(255,255,255,.97);color:var(--ink);font-family:inherit;border-radius:2px;pointer-events:auto;position:relative;z-index:5}
  .lib-rail-filter{margin-top:2px}
  .lib-rail-label{font-size:9px;letter-spacing:1.2px;font-weight:700;color:var(--rail-muted);text-transform:uppercase;margin-top:4px}
  .lib-rail-crumb{font-size:10px;color:var(--rail-muted);word-break:break-word;line-height:1.35;padding:4px 0}
  .lib-rail-folders{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
  .lib-rail-folders .folder-tile{font-size:10px;padding:8px 6px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:var(--rail-text);cursor:pointer;text-align:center;line-height:1.2;border-radius:2px}
  .lib-rail-folders .folder-tile:hover{border-color:var(--cch-gold);background:rgba(255,255,255,.12)}
  .lib-rail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
  .library-rail .pick-card{border:2px solid transparent;background:#fff;cursor:pointer;display:flex;flex-direction:column;min-width:0}
  .library-rail .pick-card:hover{border-color:var(--cch-gold)}
  .library-rail .pick-card img{width:100%;height:68px;object-fit:cover;background:#eee}
  .library-rail .pick-card .label{font-size:8.5px;padding:3px 4px;line-height:1.15;color:var(--body);min-height:28px}
  .lib-rail-actions{display:flex;flex-direction:column;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.12)}
  .lib-rail-actions .btn-upload{font-size:10px;letter-spacing:1px;padding:8px 10px;border:1px solid var(--cch-gold);background:var(--cch-gold);color:var(--cch-navy-deep);cursor:pointer;width:100%;font-weight:700;border-radius:2px}
  .lib-rail-actions .btn-upload:hover{filter:brightness(1.05)}
  .lib-rail-actions .btn-mini{font-size:10px;padding:6px 8px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.95);color:var(--ink);cursor:pointer;width:100%;border-radius:2px}
  .lib-rail-empty{font-size:11px;color:var(--rail-muted);font-style:italic;padding:8px 4px}
  .form-pane{background:#fff;overflow-y:auto;padding:20px 24px 120px;border-right:1px solid var(--hairline);min-width:0}
  .preview-pane{overflow-y:auto;padding:24px;background:#f0f2f5;min-width:0}
  .toolbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:16px}
  .toolbar .field{margin:0}
  .form-section{margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--hairline)}
  .form-section:last-child{border-bottom:none}
  .form-section h2{font-size:11px;letter-spacing:3px;color:var(--ink);font-weight:700;text-transform:uppercase;margin:0 0 12px;padding-bottom:6px;border-bottom:1px solid var(--accent)}
  .field{margin-bottom:10px;display:flex;flex-direction:column;gap:4px}
  .field label{font-size:10px;letter-spacing:1.5px;color:var(--ink);font-weight:700;text-transform:uppercase}
  .field input[type=text],.field textarea,.field select{
    border:1px solid var(--border);background:#fff;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--ink);
    border-radius:0;outline:none;transition:border-color .15s
  }
  .field textarea{resize:vertical;min-height:54px}
  .field select[multiple]{min-height:120px;padding:6px}
  .spec-attach-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
  .spec-attach-bar .spec-thumb{width:48px;height:48px;object-fit:cover;border:1px solid var(--border);background:var(--field)}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .field-row.three{grid-template-columns:1fr 1fr 1fr}
  .chip-group{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);padding:5px 10px;font-size:12px;background:#fff;cursor:pointer}
  .chip input{display:none}
  .chip.checked{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
  .picker{margin:8px 0}
  .picker-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .picker-head .picker-meta{font-size:11px;color:var(--muted)}
  .picker-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-height:230px;overflow-y:auto;padding:6px;border:1px solid var(--hairline);background:var(--field)}
  .pick-card{background:#fff;border:2px solid transparent;cursor:pointer;display:flex;flex-direction:column}
  .pick-card.selected{border-color:var(--ink)}
  .pick-card img{width:100%;height:80px;object-fit:cover;background:#eee}
  .pick-card .label{font-size:9.5px;color:var(--body);padding:4px 5px;line-height:1.2;min-height:26px}
  .picker-actions{display:flex;gap:6px;align-items:center}
  .picker-actions .btn-mini{border:1px solid var(--border);background:#fff;color:var(--ink);font-size:10px;letter-spacing:1px;padding:5px 8px}
  .picker-modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;display:flex;align-items:center;justify-content:center}
  .picker-modal{width:min(960px,92vw);max-height:86vh;background:#fff;border:1px solid var(--hairline);padding:14px;display:flex;flex-direction:column}
  .picker-modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .picker-modal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;overflow:auto}
  .field-yrd{margin-bottom:10px}
  .field-yrd label{font-size:9px;letter-spacing:1.2px;font-weight:700;text-transform:uppercase;color:var(--ink)}
  .field-yrd input{max-width:88px;padding:6px 8px;font-size:13px;text-align:center;border:1px solid var(--border)}
  .field-yrd--prominent{margin:10px 0;padding:10px 12px;background:var(--field);border:1px solid var(--hairline)}
  .field-yrd--prominent label{font-size:10px;letter-spacing:1.2px;margin-bottom:6px;display:block}
  .field-yrd--prominent input{max-width:120px;font-size:14px;font-weight:600;background:#fff}
  .trim-yrd-slot{margin:8px 0 4px;clear:both}
  .hw-block{margin-top:4px;padding:12px;background:var(--field);border:1px solid var(--hairline)}
  .hw-parts-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}
  .hw-part-row{padding:6px;border:1px solid var(--hairline);background:#fff;min-width:0;display:flex;flex-direction:column;gap:4px}
  .hw-part-row label{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .hw-part-itemno{width:100%;box-sizing:border-box;padding:4px 6px;font-size:11px;border:1px solid var(--border)}
  .hw-part-itemno::placeholder{color:#999;font-size:10px}
  .hw-part-imgrow{display:flex;align-items:center;justify-content:center;min-height:76px;width:100%;margin:4px 0;background:#fafafa;border:1px solid var(--hairline)}
  .hw-part-imgrow img{max-width:100%;max-height:76px;width:auto;height:auto;object-fit:contain}
  .hw-part-meta{font-size:9px;color:var(--muted);line-height:1.25;word-break:break-word;text-align:center}
  .hw-part-btns{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:2px;justify-content:center}
  .hw-part-btns .btn{padding:4px 5px!important;font-size:8px!important;letter-spacing:0!important}
  .hw-part-note{width:100%;box-sizing:border-box;padding:4px 6px;font-size:10px;border:1px solid var(--border)}
  .fabric-pick-thumb{width:88px;height:88px;border:1px solid var(--border);background:var(--field);flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .fabric-pick-thumb img{width:100%;height:100%;object-fit:cover}
  .upload-box{border:2px dashed var(--border);background:var(--field);padding:18px;text-align:center;cursor:pointer;font-size:11px;color:var(--muted);letter-spacing:1px}
  .upload-box.has-img{padding:0;border-style:solid;border-color:var(--hairline);background:#fff}
  .upload-box img{display:block;width:100%;max-height:180px;object-fit:cover;background:#fff}
  .upload-box .clear{font-size:10px;color:var(--flag);margin-top:6px;display:inline-block}
  .actions{position:sticky;bottom:-20px;margin-top:24px;padding:12px 0;background:#fff;border-top:1px solid var(--hairline);display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:1px solid var(--ink);background:var(--ink);color:#fff;padding:10px 16px;font-size:11px;letter-spacing:2px;font-weight:700;text-transform:uppercase}
  .btn.secondary{background:#fff;color:var(--ink)}
  .notice{padding:10px 12px;background:#FFF8E1;border:1px solid #E0CCA0;color:#7A5C20;font-size:12px;margin:8px 0}
  .error{background:#FFF0F0;border-color:#e8b6b6;color:#8e3434}
  .preview-page{width:1632px;height:auto;min-height:1008px;background:#fff;margin:0 auto 24px;box-shadow:0 4px 18px rgba(0,0,0,.12);position:relative;overflow:hidden;border-top:none}
  .preview-shrink{transform:scale(0.52);transform-origin:top left;margin-bottom:-460px}
  .preview-page .pp-header{
    display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;
    padding:16px 32px 12px;color:var(--ink);
    border-bottom:1px solid var(--ink)
  }
  .preview-page .pp-header-brand{
    font-family:Calibri,Arial,sans-serif;font-size:13px;font-weight:600;letter-spacing:0.02em;color:var(--ink);
    flex-shrink:0;order:0
  }
  .preview-page .pp-title{flex:1;min-width:200px;font-size:18px;letter-spacing:0.04em;line-height:1.25;order:1}
  .preview-page .pp-title .num{color:var(--flag);font-style:italic;font-weight:700;margin-left:6px}
  .preview-page .pp-page{
    font-size:10px;letter-spacing:0.12em;color:var(--muted);text-transform:uppercase;
    flex-shrink:0;text-align:right;white-space:nowrap;order:2
  }
  .preview-page .pp-room-banner{
    margin:0 32px;padding:12px 0 10px;
    background:transparent;border:none;box-shadow:none;
    border-bottom:1px solid var(--hairline)
  }
  .preview-page .pp-room-primary{font-family:Calibri,Arial,sans-serif;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.02em;line-height:1.25;word-break:break-word}
  .preview-page .pp-room-primary .pp-room-ph{color:#8a96a8;font-style:italic;font-weight:600;font-size:16px;font-family:Calibri,Arial,sans-serif}
  .preview-page .pp-room-sub{margin-top:8px;font-size:12px;font-weight:700;color:var(--ink);letter-spacing:.12em;text-transform:uppercase;line-height:1.35;word-break:break-word}
  .preview-page .pp-room-sub .pp-room-ph{color:var(--muted);font-weight:600;letter-spacing:.06em}
  .preview-page .pp-loc{padding:6px 32px 28px;font-size:11px;color:var(--ink);letter-spacing:.03em;border-bottom:1px solid var(--hairline);position:relative;min-height:36px}
  .preview-page .pp-loc-meta{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding-bottom:2px}
  .preview-page .pp-treatment{position:absolute;right:32px;bottom:8px;font-size:10px;letter-spacing:3px;font-weight:700;color:var(--ink);text-transform:uppercase}
  .preview-body{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:14px;padding:16px 32px 12px}
  .preview-body.preview-bedding{grid-template-columns:0.7fr 1.22fr 1.38fr}
  .pp-section{font-size:11px;letter-spacing:3px;font-weight:700;color:var(--ink);text-transform:uppercase;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--hairline)}
  .pp-intent{font-size:11px;font-style:italic;color:var(--body);line-height:1.4;margin-bottom:12px}
  .pp-intent.pp-intent--compact{font-size:9px;line-height:1.25;margin-bottom:8px;max-height:3.75em;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;line-clamp:3}
  .pp-specs{font-size:12.5px;color:var(--body);line-height:1.5}
  .pp-specs .pp-spec-row{display:flex;gap:12px;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap}
  .pp-specs .pp-spec-row .pp-spec-text{flex:1;min-width:140px;line-height:1.45}
  .pp-specs .pp-spec-row .pp-spec-text b{font-size:13px;font-weight:700;color:var(--ink)}
  .pp-specs .pp-spec-thumb{width:96px;height:96px;object-fit:cover;border:1px solid var(--rule);flex-shrink:0}
  .pp-specs .pp-spec-imgnote{font-size:11px;color:var(--muted);margin:-2px 0 8px 2px;font-style:italic;line-height:1.35}
  .pp-rendering{background:#fff;border:1px solid var(--hairline);min-height:300px;max-height:500px;height:400px;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .pp-rendering.pp-rendering--has-img{background:#fff;border:1px solid var(--hairline)}
  .preview-body.preview-bedding .pp-rendering{min-height:260px;max-height:430px;height:340px}
  .pp-rendering img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;object-position:center}
  /* Roller: modest hero so face / hardware / detail images fit directly below in the center column. */
  .preview-page.preview-page--roller .pp-rendering{min-height:140px;max-height:260px;height:200px}
  .preview-page.preview-page--roller .pp-roller-detail-row{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;padding-top:8px;
    border-top:1px solid var(--hairline)
  }
  .preview-page.preview-page--roller .pp-roller-detail-row.pp-roller-detail-row--n2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .preview-page.preview-page--roller .pp-roller-detail-row.pp-roller-detail-row--n1{grid-template-columns:minmax(0,1fr)}
  .preview-page.preview-page--roller .pp-roller-detail-row .pp-diag-frame{min-height:72px;max-height:110px}
  .preview-page.preview-page--roller .pp-roller-detail-row .pp-diag-frame img{max-height:104px}
  .preview-page.preview-page--roller .pp-roller-detail-row .pp-diag-caption{font-size:9px;color:var(--muted);line-height:1.25;margin-top:4px;font-style:italic}
  /* Drapery / window WO: picker + section + optional detail images under hero (center column). */
  .preview-body .pp-wt-detail-row{
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px;padding-top:8px;
    border-top:1px solid var(--hairline)
  }

(function attachBuilderAuthUi() {
  async function builderAttemptSignIn() {
    var eh = document.getElementById("builderAuthEmailHeader");
    var ph = document.getElementById("builderAuthPasswordHeader");
    var email = String((eh && eh.value) || "").trim();
    var pass = String((ph && ph.value) || "");
    var errH = document.getElementById("builderAuthErrorHeader");
    if (errH) {
      errH.style.display = "none";
      errH.textContent = "";
    }
    try {
      await auth.signInWithEmailAndPassword(email, pass);
    } catch (e) {
      var msg = (e && e.message) ? String(e.message) : "Sign-in failed.";
      var friendly = msg.toLowerCase().indexOf("invalid") >= 0 || msg.toLowerCase().indexOf("wrong") >= 0
        ? "Invalid email or password."
        : msg;
      if (errH) {
        errH.textContent = friendly;
        errH.style.display = "block";
      }
    }
  }

  var submitHeader = document.getElementById("builderAuthSubmitHeader");
  if (submitHeader) submitHeader.addEventListener("click", builderAttemptSignIn);

  var pwh = document.getElementById("builderAuthPasswordHeader");
  if (pwh) {
    pwh.addEventListener("keydown", function(ev) {
      if (ev.key === "Enter") builderAttemptSignIn();
    });
  }
})();

function cleanLibraryImageLabel(raw) {
  let s = String(raw || "")
    .replace(/\.[^.]+$/, "")
    .replace(/[_-]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
  // Storage filenames often begin with a timestamp / numeric id. That id is not useful in the UI.
  s = s.replace(/^\d{8,}\s*/, "").trim();
  return s || "Image";
}

/** Drapery pleat style chip → subfolder under library/pleats/ (create matching folders in Storage). */
const DRAPERY_PLEAT_STYLE_FOLDER = {
  "Inverted pleat": "inverted_pleat",
  "Pinch pleat - French": "pinch_pleat_french",
  "Pinch pleat - Euro": "pinch_pleat_euro",
  "Ripplefold": "ripplefold",
  "Goblet": "goblet",
  "Box pleat": "box_pleat"
};
function pleatStyleToSubfolder(optionLabel) {
  if (!optionLabel) return "";
  if (DRAPERY_PLEAT_STYLE_FOLDER[optionLabel]) return DRAPERY_PLEAT_STYLE_FOLDER[optionLabel];
  return String(optionLabel).toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "general";
}

/**
 * Project rooms: board.rooms (array or legacy object map) + roomMeta + clip.room,
 * plus roomBoards / rooms subcollections. Names are whitespace-normalized, deduped case-insensitively,
 * capped at 200 characters (Studio has no cap; long descriptive room names were previously dropped at 40).
 */
async function loadProjectRooms(projectId) {
  if (!projectId) { state.projectRooms = []; return; }
  const orderedNames = [];
  const seen = new Set();
  const MAX_ROOM_NAME = 200;
  function normRoomStr(raw) {
    return String(raw || "").replace(/\s+/g, " ").trim();
  }
  function pushRoomName(raw) {
    const name = normRoomStr(raw);
    if (!name || name.length > MAX_ROOM_NAME) return;
    const key = name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    orderedNames.push(name);
  }
  function roomFromBoardEntry(r) {
    if (typeof r === "string") return r;
    if (r && typeof r === "object") {
      return r.name || r.displayName || r.roomName || r.room || r.title || r.label || "";
    }
    return "";
  }
  try {
    const boardRef = db.collection("boards").doc(projectId);
    const boardDoc = await boardRef.get();
    const bx = boardDoc.exists ? boardDoc.data() || {} : {};
    const br = bx.rooms;
    if (Array.isArray(br)) {
      br.forEach(r => pushRoomName(roomFromBoardEntry(r)));
    } else if (br && typeof br === "object") {
      Object.keys(br).forEach(k => pushRoomName(roomFromBoardEntry(br[k])));
    }

    try {
      const rmSnap = await boardRef.collection("roomMeta").get();
      rmSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.roomName || x.room || x.title || x.label);
      });
    } catch (eRm) { console.warn("[Builder] roomMeta", eRm); }

    try {
      const rbSnap = await boardRef.collection("roomBoards").limit(500).get();
      rbSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.room || x.roomName || x.title || x.label || d.id);
      });
    } catch (eRb) {}

    try {
      const roomsSnap = await boardRef.collection("rooms").limit(500).get();
      roomsSnap.forEach(d => {
        const x = d.data() || {};
        pushRoomName(x.name || x.displayName || x.room || x.roomName || x.title || x.label || d.id);
      });
    } catch (eR) {}

    if (!orderedNames.length) {
      let lastClip = null;
      const clipPage = 300;
      for (let guard = 0; guard < 8; guard++) {
        let q = boardRef.collection("clips").limit(clipPage);
        if (lastClip) q = q.startAfter(lastClip);
        const clipSnap = await q.get();
        if (clipSnap.empty) break;
        clipSnap.forEach(d => {
          const cr = normRoomStr((d.data() || {}).room);
          if (cr) pushRoomName(cr);
        });
        if (clipSnap.docs.length < clipPage || orderedNames.length >= 200) break;
        lastClip = clipSnap.docs[clipSnap.docs.length - 1];
      }
    }

    orderedNames.sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
    state.projectRooms = orderedNames.map((name, i) => {
      const slug = String(name || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "") || "r";
      return { id: "room:" + i + ":" + slug, name };
    });
  } catch (e) {
    console.warn("[Builder] loadProjectRooms", e);
    state.projectRooms = [];
  }
}

/**
 * Studio keeps master rows in `products` and richer copies in `productLibrary` — merge by doc id (same as main app).
 * Paginates so large catalogs (2000+) are not capped at a single limit().
 */
async function loadProductLibrary() {
  const mergeMap = {};
  const batchSize = 500;
  const maxBatchesPerCollection = 120;
  try {
    let lastP = null;
    let lastL = null;
    let batchNum = 0;

    const snapP0 = await db.collection("products").limit(batchSize).get();
    snapP0.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
    lastP = snapP0.docs.length === batchSize ? snapP0.docs[snapP0.docs.length - 1] : null;

    try {
      const snapL0 = await db.collection("productLibrary").limit(batchSize).get();
      snapL0.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
      lastL = snapL0.docs.length === batchSize ? snapL0.docs[snapL0.docs.length - 1] : null;
    } catch (eLib) {
      lastL = null;
    }

    while ((lastP || lastL) && batchNum < maxBatchesPerCollection) {
      batchNum++;
      if (lastP) {
        const snap = await db.collection("products").startAfter(lastP).limit(batchSize).get();
        snap.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
        lastP = snap.docs.length === batchSize ? snap.docs[snap.docs.length - 1] : null;
      }
      if (lastL) {
        try {
          const snap = await db.collection("productLibrary").startAfter(lastL).limit(batchSize).get();
          snap.docs.forEach(d => mergeFirestoreDocIntoProductMap(mergeMap, d));
          lastL = snap.docs.length === batchSize ? snap.docs[snap.docs.length - 1] : null;
        } catch (e2) {
          lastL = null;
        }
      }
    }

    state.productLibrary = Object.values(mergeMap).map(row => {
      normalizeBuilderLibraryRow(row);
      return row;
    });
  } catch (e) {
    console.warn("[Builder] loadProductLibrary", e);
    state.productLibrary = [];
  }

function categoryIsFabricTrimCatalog(cat) {

/**
 * Project clips (this board) + products linked to the project first, then catalog.

 * opts.fabricTrimCatalogOnly — fabric mode only: restrict catalog/clips to Studio “Fabric & Trim” bucket.
 * opts.hardwareCatalogOnly — hardware mode only: restrict to Studio “Hardware” category (not Lighting, etc.).
 */
function buildMaterialPickList(projectId, mode, opts) {
  const fabricTrimOnly = !!(opts && opts.fabricTrimCatalogOnly);
  const hardwareCatalogOnly = !!(opts && opts.hardwareCatalogOnly);
  const out = [];

  function dedupePush(row, key) {
    if (!row || !row.imageUrl || seen.has(key)) return;
    seen.add(key);
    out.push(row);
  }
  function productPassesMode(p) {
    if (mode === "hardware") {
      if (hardwareCatalogOnly) return categoryIsHardwareCatalog(p.category);
      return categoryMatchesHardwareMaterial(p.category);
    }
    if (fabricTrimOnly) return categoryIsFabricTrimCatalog(p.category);
    return categoryMatchesFabricMaterial(p.category);
  }
  function clipPassesMode(catStr) {
    if (mode === "hardware") {
      if (hardwareCatalogOnly) return catStr ? categoryIsHardwareCatalog(catStr) : false;
      return catStr ? materialMatchesMode(catStr, mode) : false;
    }
    if (!fabricTrimOnly) return catStr ? materialMatchesMode(catStr, mode) : true;
    if (!catStr) return true;
    return categoryIsFabricTrimCatalog(catStr);
  }
  if (projectId) {
    (state.inspirationItems || []).forEach(i => {
      const cat = i.category || "";
      if (!clipPassesMode(cat)) return;
      dedupePush({
        id: "clip:" + i.id,
        title: i.title,
        name: i.title,
        imageUrl: i.imageUrl,
        vendor: i.vendor,
        sku: i.sku,
        width: i.width,
        repeat: i.repeat,
        materials: i.materials,
        category: cat,
        _fromProject: true

    (state.productLibrary || []).forEach(p => {
      if (!p || !p.imageUrl || !productLinkedToProject(p, projectId)) return;
      if (!productPassesMode(p)) return;
      dedupePush(Object.assign({ _fromProject: true }, p), "projprod:" + p.id);
    });
  }
  (state.productLibrary || []).forEach(p => {
    if (!p || !p.imageUrl || seen.has("prod:" + p.id)) return;
    if (!productPassesMode(p)) return;
    if (projectId && productLinkedToProject(p, projectId)) return;
    dedupePush(Object.assign({ _fromProject: false }, p), "prod:" + p.id);
  });

}

/** Clipper + Product Library store H/V repeat and direction separately; fabric "Repeat" is one line. */
function composePatternRepeatFromProduct(p) {
  if (!p || typeof p !== "object") return "";
  const h = String(p.patternRepeatHorizontal || "").trim();
  const v = String(p.patternRepeatVertical || "").trim();
  const dir = String(p.patternRepeatDirection || "").trim();
  const pr = String(p.patternRepeat || "").trim();
  const parts = [];
  if (h) parts.push("H repeat " + h);
  if (v) parts.push("V repeat " + v);
  if (dir) parts.push("Direction: " + dir);
  else if (pr && (h || v) && /horizontal|vertical/i.test(pr)) parts.push("Direction: " + pr);
  if (parts.length) return parts.join(" · ");
  if (pr) return pr;
  return String(p.repeat || p.vRepeat || p.hRepeat || "").trim();
}

    uploadsCopy = JSON.parse(JSON.stringify(state.uploads[cat] || {}));
  } catch (e) {
    console.warn("[Builder] draft copy", e);
    return;
  }
  let blob = JSON.stringify({ data: dataCopy, pickers: pickCopy, uploads: uploadsCopy });
  if (blob.length > BUILDER_LOCAL_DRAFT_MAX_BYTES) {
    uploadsCopy = {};
    blob = JSON.stringify({ data: dataCopy, pickers: pickCopy, uploads: uploadsCopy });
  }
  if (blob.length > BUILDER_LOCAL_DRAFT_MAX_BYTES) {
    console.warn("[Builder] draft skipped (too large for browser storage)");
    return;
  }
  const payload = {
    v: BUILDER_LOCAL_DRAFT_VER,
    savedAt: Date.now(),
    projectId,
    category: cat,
    workOrderId: woId || null,
    revision: rev,
    data: dataCopy,
    pickers: pickCopy,
    uploads: uploadsCopy
  };
  const key = builderLocalDraftKey(projectId, cat, woId || "new");
  try {
    localStorage.setItem(key, JSON.stringify(payload));
    writeBuilderSession();
  } catch (e) {
    if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
      console.warn("[Builder] draft quota exceeded — save to project to keep work");
    } else {
      console.warn("[Builder] draft setItem", e);
    }
  }
}

/** Returns true if a draft was merged into state (unsaved work recovered). */
function maybeRestoreBuilderLocalDraft(cat) {
  const d = getCatData(cat);
  const projectId = (d.projectId || "").trim();
  if (!projectId) return false;
  const woId = state.currentWorkOrderId || "";
  const key = builderLocalDraftKey(projectId, cat, woId || "new");
  let raw;
  try {
    raw = localStorage.getItem(key);
  } catch (e) {
    return false;
  }
  if (!raw) return false;
  let draft;
  try {
    draft = JSON.parse(raw);
  } catch (e) {
    return false;
  }
  if (!draft || draft.v !== BUILDER_LOCAL_DRAFT_VER) return false;
  if (String(draft.projectId || "") !== projectId || String(draft.category || "") !== cat) return false;
  const draftWo = draft.workOrderId || "";
  if (draftWo !== woId) return false;
  const age = Date.now() - Number(draft.savedAt || 0);
  if (age > BUILDER_LOCAL_DRAFT_MAX_AGE_MS || age < 0) {
    try {
      localStorage.removeItem(key);
    } catch (e2) {}
    return false;
  }
  const serverRev = Number(d.revision || 1);
  const draftRev = Number(draft.revision || 1);
  if (woId && serverRev !== draftRev) {
    const msg = "This browser has an unsaved draft (rev " + draftRev + ") from "
      + new Date(draft.savedAt).toLocaleString()
      + ". The saved work order is revision " + serverRev + ".\n\nRestore the unsaved draft?\n(Cancel keeps the saved copy.)";
    if (!confirm(msg)) {
      try {
        localStorage.removeItem(key);
      } catch (e3) {}
      return false;
    }
  }
  try {
    state.data[cat] = { ...defaultData(cat), ...(draft.data || {}) };
    state.pickers[cat] = draft.pickers && typeof draft.pickers === "object" ? draft.pickers : {};
    state.uploads[cat] = draft.uploads && typeof draft.uploads === "object" ? draft.uploads : {};
    state.uploadFiles[cat] = {};
    const dm = state.data[cat];
    normalizeFabricYards(dm, cat);
    syncExtraFabricRolesFromFabrics(dm, cat);
    ensureWindowHardware(dm);
    ensureImageCaptions(dm);
    ensureImageSlotTitles(dm);
    migrateLegacyRoomLocation(dm);
    stripWorkroomVendorFromFabricsWithoutProduct(dm);
  } catch (e4) {
    console.warn("[Builder] draft restore", e4);
    return false;
  }
  state.builderDraftUiMessage = "Restored unsaved browser draft — Save when ready.";
  return true;
}

function syncBuilderUrl() {
  const cat = state.category;
  const d = getCatData(cat);
  const projectId = (d.projectId || "").trim();
  const woId = state.currentWorkOrderId || "";
  if (!projectId) return;
  try {
    const u = new URL(window.location.href);
    u.searchParams.set("projectId", projectId);
    if (woId) u.searchParams.set("workOrderId", woId);
    else u.searchParams.delete("workOrderId");
    u.searchParams.set("category", cat);
    history.replaceState({}, "", u.pathname + "?" + u.searchParams.toString() + u.hash);
  } catch (e) {}
}

function updateHeaderSaveUI(mode) {
  const bar = document.getElementById("headerSaveBar");
  const statusEl = document.getElementById("headerSaveStatus");
  const woEl = document.getElementById("headerWoStatus");
  const btn = document.getElementById("headerSaveBtn");
  if (!bar || !statusEl || !woEl) return;
  if (document.body.classList.contains("builder-signed-in")) bar.style.display = "flex";
  const d = getCatData(state.category);
  const woNum = String(d.workOrder || "").trim();
  const saved = !!state.currentWorkOrderId;
  if (woNum) woEl.textContent = "WO " + woNum + (saved ? "" : " (unsaved)");
  else if (saved) woEl.textContent = "Saved work order";
  else woEl.textContent = "New work order";
  const formHint = document.getElementById("formSaveHint");
  if (mode === "saving") {
    statusEl.textContent = "Saving…";
    if (formHint) formHint.textContent = "Saving…";
    if (btn) btn.disabled = true;
  } else if (mode === "saved") {
    statusEl.textContent = "Saved";
    if (formHint) formHint.textContent = "Saved — safe to refresh.";
    if (btn) btn.disabled = false;
  } else if (mode === "error") {
    statusEl.textContent = "Save failed";
    if (formHint) formHint.textContent = "Save failed — try again.";
    if (btn) btn.disabled = false;
  } else {
    statusEl.textContent = saved ? "" : "Save before refresh";
    if (formHint) {
      if (state.builderDraftUiMessage) {
        formHint.textContent = state.builderDraftUiMessage;
        state.builderDraftUiMessage = "";
      } else {
        formHint.textContent = saved ? "Saved to project — safe to refresh after Save." : "Save to store on the project. Unsaved text & specs auto-backup in this browser (~2 s after you stop typing).";
      }
    }
    if (btn) btn.disabled = false;
  }
}

async function saveWorkOrder(isNewRevision) {
  updateHeaderSaveUI("saving");
  const cat = state.category;
  const data = getCatData(cat);
  const projectId = (data.projectId || "").trim();
  if (!projectId) { alert("Project ID is required."); updateHeaderSaveUI(); return false; }
  if (!String(data.room || "").trim()) { alert("Room is required."); updateHeaderSaveUI(); return false; }
  if (isWindowTreatmentCategory(cat) && !String(data.location || "").trim()) {
    alert("Window tag is required (e.g. W1, W2). This prints on the work order and drives proposal sequencing.");
    updateHeaderSaveUI();
    return false;
  }
  if (SHADE_ROLL_CATS.has(cat)) {
    syncShadeSpecsMountAndRollOff(cat, data);
    if (!parseShadeMountCompound(String((data.specs || {}).mount || "")).roll) {
      alert("Select mount & fabric roll — each option includes roll off front or roll off back.");
      updateHeaderSaveUI();
      return false;
    }
  }
  try {
  const col = db.collection("boards").doc(projectId).collection("workOrders");
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const existingId = state.currentWorkOrderId && !isNewRevision ? state.currentWorkOrderId : "";
  const docRef = existingId ? col.doc(existingId) : col.doc();
  if (!data.workOrder) {
    data.workOrder = nextWorkOrderNumber(data.project, cat, state.workOrdersByProject);
  }
  const conflicting = (state.workOrdersByProject || []).find(x =>
    x.id !== existingId && String(x.workOrderNumber || "").toUpperCase() === String(data.workOrder || "").toUpperCase()
  );
  if (conflicting) {
    data.workOrder = nextWorkOrderNumber(data.project, cat, state.workOrdersByProject);
  }
  await uploadPendingAssets(cat, projectId, docRef.id);
  const payload = {
    category: cat,
    projectId,
    projectName: data.project || "",
    address: data.address || "",
    workroomId: data.workroomId || "",
    workroomName: data.workroomName || "",
    workOrderNumber: data.workOrder || "",
    room: data.room || "",
    location: data.location || "",
    designIntent: data.designIntent || "",
    treatmentOptions: data.treatmentOptions || [],
    sameWindowTagMultipleTreatments: !!data.sameWindowTagMultipleTreatments,
    pairedTreatmentNote: data.pairedTreatmentNote || "",
    trimOptions: data.trimOptions || [],
    detailSelections: data.detailSelections || {},
    extraFabricRoles: data.extraFabricRoles || [],
    specs: data.specs || {},
    specCustomText: data.specCustomText || {},
    fabrics: data.fabrics || {},
    measurements: data.measurements || {},
    pickerSelections: state.pickers[cat] || {},
    notes: data.notes || [],
    fabNotes: data.fabNotes || [],
    renderingUrl: data.renderingUrl || "",
    detailSketchUrl: data.detailSketchUrl || "",
    elevationUrl: data.elevationUrl || "",
    sectionViewUrl: data.sectionViewUrl || "",
    imageCaptions: data.imageCaptions || {},
    imageSlotTitles: data.imageSlotTitles || {},
    treatmentLayerDetails: data.treatmentLayerDetails || {},
    trimBanding: data.trimBanding || {},
    trimOptionDetails: data.trimOptionDetails || {},
    windowHardware: data.windowHardware || {},
    specAttachments: data.specAttachments || {},
    specAttachmentNotes: data.specAttachmentNotes || {},
    materialPlacementNote: data.materialPlacementNote || "",
    swatchUrls: data.swatchUrls || {},
    revision: Number(data.revision || 1),
    updatedAt: now,
    createdAt: existingId ? (data.createdAt || now) : now
  };
  await docRef.set(payload, { merge:true });
  state.currentWorkOrderId = docRef.id;
  if (!existingId) data.revision = 1;
  if (isNewRevision) data.revision = Number(data.revision || 1) + 1;
  state.workOrdersByProject = await listWorkOrders(projectId);
  writeBuilderSession();
  clearBuilderLocalDraftAfterSave();
  syncBuilderUrl();
  updateHeaderSaveUI("saved");
  renderForm();
  return true;
  } catch (err) {
    console.error("[Builder] saveWorkOrder", err);
    alert("Save failed: " + (err && err.message ? String(err.message) : String(err)));
    updateHeaderSaveUI("error");
    return false;
  }
}

async function loadWorkOrderById(id) {
  const cat = state.category;
  const data = getCatData(cat);
  if (!id) {
    const keep = {
      projectId: data.projectId || "",
      project: data.project || "",
      address: data.address || "",
      workroomId: data.workroomId || "",
      workroomName: data.workroomName || "",
      room: data.room || "",
      location: data.location || ""
    };
    state.currentWorkOrderId = "";
    state.data[cat] = {
      ...defaultData(cat),
      ...keep
    };
    state.pickers[cat] = {};
    state.uploads[cat] = {};
    state.uploadFiles[cat] = {};
    const fresh = getCatData(cat);
    if (fresh.projectId) fresh.workOrder = nextWorkOrderNumber(fresh.project, cat, state.workOrdersByProject);
    maybeRestoreBuilderLocalDraft(cat);
    renderForm();
    return;
  }
  const projectId = (data.projectId || "").trim();
  if (!projectId) return;
  const snap = await db.collection("boards").doc(projectId).collection("workOrders").doc(id).get();
  if (!snap.exists) return;
  const row = snap.data();
  state.currentWorkOrderId = id;
  const mergedCat = row.category || cat;
  state.data[mergedCat] = {
    ...defaultData(mergedCat),
    ...row
  };
  const dm = state.data[mergedCat];
  if (!dm.workOrder && dm.workOrderNumber) dm.workOrder = dm.workOrderNumber;
  migrateLegacyRoomLocation(dm);
  stripWorkroomVendorFromFabricsWithoutProduct(dm);
  syncExtraFabricRolesFromFabrics(dm, mergedCat);
  normalizeFabricYards(dm, mergedCat);
  if (!state.workOrdersByProject.some(x => x.id === id)) {
    state.workOrdersByProject = [{ id, ...row }].concat(state.workOrdersByProject || []);
  }
  state.pickers[mergedCat] = row.pickerSelections || {};
  state.uploads[mergedCat] = {};
  state.uploadFiles[mergedCat] = {};
  state.category = mergedCat;
  state.uiGroup = currentGroupFromCategory(state.category);
  if (state.libraryRail) state.libraryRail.userPickedFolder = false;
  document.querySelectorAll("#tabs button").forEach(b => {
    const grp = b.dataset.group || (b.dataset.cat ? currentGroupFromCategory(b.dataset.cat) : "windows");
    b.classList.toggle("active", grp === state.uiGroup);
  });
  maybeRestoreBuilderLocalDraft(mergedCat);
  writeBuilderSession();
  syncBuilderUrl();
}

async function duplicateWorkOrderFromFirestore(projectId, sourceDocId) {
  const snap = await db.collection("boards").doc(projectId).collection("workOrders").doc(sourceDocId).get();
  if (!snap.exists) return;
  const row = snap.data();
  const cat = row.category || state.category;
  state.category = cat;
  state.uiGroup = currentGroupFromCategory(cat);
  document.querySelectorAll("#tabs button").forEach(b => {
    const grp = b.dataset.group || (b.dataset.cat ? currentGroupFromCategory(b.dataset.cat) : "windows");
    b.classList.toggle("active", grp === state.uiGroup);
  });
  state.currentWorkOrderId = "";
  state.data[cat] = { ...defaultData(cat), ...row };
  const d = state.data[cat];
  if (!d.workOrder && d.workOrderNumber) d.workOrder = d.workOrderNumber;
  state.pickers[cat] = JSON.parse(JSON.stringify(row.pickerSelections || {}));
  state.uploads[cat] = {};
  state.uploadFiles[cat] = {};
  const chosen = await ensureProjectInBuilderState(projectId);
  if (chosen) {
    d.projectId = projectId;
    d.project = chosen.name || chosen.id || "";
    d.address = chosen.address || "";
  }
  await loadProjectRooms(projectId);
  migrateLegacyRoomLocation(d);
  syncExtraFabricRolesFromFabrics(d, cat);
  normalizeFabricYards(d, cat);
  d.revision = 1;
  d.date = new Date().toLocaleDateString("en-US");
  d.workOrder = nextWorkOrderNumber(d.project, cat, state.workOrdersByProject || []);
  if (state.libraryRail) state.libraryRail.userPickedFolder = false;
  clearBuilderLocalDraftNewSlot(projectId, cat);
}

async function applyBuilderQueryParams() {
  const params = new URLSearchParams(window.location.search);
  let projectId = (params.get("projectId") || params.get("project") || "").trim();
  let workOrderId = (params.get("workOrderId") || params.get("wo") || "").trim();
  const duplicateFrom = (params.get("duplicateFrom") || "").trim();
  const categoryParam = (params.get("category") || "").trim();
  if (categoryParam && CATS[categoryParam]) state.category = categoryParam;
  if (!projectId || !workOrderId) {
    const sess = readBuilderSession();
    if (sess) {
      const sessProjectId = String(sess.projectId || "").trim();
      if (!projectId) projectId = sessProjectId;
      if (!workOrderId && (!projectId || sessProjectId === projectId)) workOrderId = String(sess.workOrderId || "").trim();
      if (!categoryParam && sess.category && CATS[sess.category]) state.category = sess.category;
    }
  }
  if (!projectId) return;
  try {
    const chosen = await ensureProjectInBuilderState(projectId);
    if (!chosen) return;
    state.currentWorkOrderId = "";
    Object.keys(CATS).forEach(catId => applySelectedProjectToCategory(catId, chosen));
    const d0 = getCatData(state.category);
    d0.projectId = projectId;
    d0.project = chosen.name || chosen.id || "";
    d0.address = chosen.address || "";
    const willLoadRoomsDownstream = !!(duplicateFrom || workOrderId);
    if (workOrderId && !duplicateFrom) {
      listWorkOrders(projectId).then(rows => {
        state.workOrdersByProject = rows;
        renderForm();
      }).catch(e => console.warn("[Builder] background work orders", e));
      loadInspirationItems(projectId).catch(e => console.warn("[Builder] background inspiration", e));
      await loadWorkOrderById(workOrderId);
    } else {
      const [woRows] = await Promise.all([
        listWorkOrders(projectId),
        willLoadRoomsDownstream ? Promise.resolve() : loadProjectRooms(projectId)
      ]);
      state.workOrdersByProject = woRows;
      loadInspirationItems(projectId).catch(e => console.warn("[Builder] background inspiration", e));
    }
    if (duplicateFrom) {
      await duplicateWorkOrderFromFirestore(projectId, duplicateFrom);
    } else if (!workOrderId) {
      maybeRestoreBuilderLocalDraft(state.category);
      writeBuilderSession();
    }
    syncBuilderUrl();
  } catch (e) {
    console.warn("[Builder] applyBuilderQueryParams", e);
    if (!state.builderBootError) {
      state.builderBootError = "Could not apply URL parameters (project / work order). " + (e && e.message ? String(e.message) : String(e));
    }
  }
}

function buildUpload(cat, key, hint) {
  const wrap = el("div", { class:"upload-box" });
  const cur = state.uploads[cat] && state.uploads[cat][key];
  function clearStoredValue() {
    const gd = getCatData(cat);
    if (key === "rendering") {
      gd.renderingUrl = "";
      if (gd.imageCaptions) gd.imageCaptions.rendering = "";
    } else if (key === "detail") gd.detailSketchUrl = "";
    else if (key === "elevation") gd.elevationUrl = "";
    else if (key === "sectionView") {
      gd.sectionViewUrl = "";
      if (gd.imageCaptions) gd.imageCaptions.sectionView = "";
      if (gd.imageSlotTitles) gd.imageSlotTitles.sectionView = "";
    } else if (key === "custom4") {
      if (gd.swatchUrls) delete gd.swatchUrls.custom4;
      if (gd.imageCaptions) gd.imageCaptions.custom4 = "";
      if (gd.imageSlotTitles) gd.imageSlotTitles.custom4 = "";
    } else if (/^(rollerSlot[0-2]|wtDetail[01])$/.test(key)) {
      if (gd.swatchUrls) delete gd.swatchUrls[key];
      if (gd.imageCaptions) gd.imageCaptions[key] = "";
      if (gd.imageSlotTitles) gd.imageSlotTitles[key] = "";
    } else if (gd.swatchUrls && gd.swatchUrls[key]) delete gd.swatchUrls[key];
  }
  if (cur) {
    wrap.classList.add("has-img");
    wrap.append(el("img", { src: cur }));
    wrap.append(el("div", { style:"padding:4px 8px;font-size:10px" }, el("a", { href:"#", class:"clear", onclick: e => {
      e.preventDefault();
      delete state.uploads[cat][key];
      delete state.uploadFiles[cat][key];
      clearStoredValue();
      renderForm();
    }}, "Remove")));
  } else {
    const gd = getCatData(cat);
    const existing = key === "rendering" ? (gd.renderingUrl || "")
      : key === "detail" ? (gd.detailSketchUrl || "")
      : key === "elevation" ? (gd.elevationUrl || "")
      : key === "sectionView" ? (gd.sectionViewUrl || "")
      : ((gd.swatchUrls || {})[key] || "");
    if (existing) {
      wrap.classList.add("has-img");
      wrap.append(el("img", { src: existing }));
      wrap.append(el("div", { style:"padding:4px 8px;font-size:10px" }, el("a", { href:"#", class:"clear", onclick: e => {
        e.preventDefault();
        clearStoredValue();
        renderForm();
      }}, "Remove")));
    } else {
      wrap.append(el("div", {}, hint));
    }
  }
  wrap.addEventListener("click", () => {
    const inp = el("input", { type:"file", accept:"image/*" });
    inp.addEventListener("change", e => {
      const f = e.target.files && e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = ev => {
        state.uploads[cat][key] = ev.target.result;
        state.uploadFiles[cat][key] = f;
        updatePreview();
        renderForm();
      };
      r.readAsDataURL(f);
    });
    inp.click();
  });
  return wrap;
}

async function uploadPendingAssets(cat, projectId, workOrderIdOverride) {
  const d = getCatData(cat);
  const files = state.uploadFiles[cat] || {};
  const pendingUploads = state.uploads[cat] || {};
  const keys = Array.from(new Set(Object.keys(files).concat(Object.keys(pendingUploads))));
  for (const key of keys) {
    const file = files[key];
    const pendingData = pendingUploads[key];
    if (!file && !pendingData) continue;
    const workOrderId = workOrderIdOverride || state.currentWorkOrderId;
    if (!workOrderId) throw new Error("Save the work order before uploading images.");
    const pendingBlob = file ? null : dataUriToBlob(pendingData);
    if (!file && !pendingBlob) continue;
    const uploadBody = file || pendingBlob.blob;
    const uploadType = (file && file.type) || (pendingBlob && pendingBlob.contentType) || "image/jpeg";
    const ext = ((file && file.name ? file.name.split(".").pop() : "") || (pendingBlob && pendingBlob.ext) || "jpg").toLowerCase();
    let dest;
    if (key === "rendering") {
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/rendering/" + Date.now() + "-" + key + "." + ext;
    } else if (key === "detail") {
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/details/" + Date.now() + "-detail." + ext;
    } else if (key === "elevation") {
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/elevations/" + Date.now() + "-elevation." + ext;
    } else if (key === "sectionView") {
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/sections/" + Date.now() + "-section." + ext;
    } else if (key.indexOf("picker_") === 0) {
      const pid = key.slice(7);
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/picker_uploads/" + pid + "/" + Date.now() + "-ref." + ext;
    } else if (key.indexOf("specAttach_") === 0) {
      const sid = key.slice(11);
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/spec_refs/" + sid + "/" + Date.now() + "-img." + ext;
    } else if (key.indexOf("hw_") === 0) {
      const partId = key.slice(3);
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/hardware/" + partId + "/" + Date.now() + "-img." + ext;
    } else if (key.indexOf("trim_") === 0) {
      const trimSlug = key.slice(5);
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/trim/" + trimSlug + "/" + Date.now() + "-img." + ext;
    } else {
      dest = "projects/" + projectId + "/workOrders/" + workOrderId + "/swatches/" + Date.now() + "-" + key + "." + ext;
    }
    const ref = storage.ref(dest);
    await ref.put(uploadBody, { contentType: uploadType });
    const url = await ref.getDownloadURL();
    if (key === "rendering") d.renderingUrl = url;
    else if (key === "detail") d.detailSketchUrl = url;
    else if (key === "elevation") d.elevationUrl = url;
    else if (key === "sectionView") d.sectionViewUrl = url;
    else if (key.indexOf("picker_") === 0) {
      const pid = key.slice(7);
      if (!state.pickers[cat]) state.pickers[cat] = {};
      state.pickers[cat][pid] = {
        category: "upload",
        storagePath: dest,
        path: dest,
        label: "Uploaded reference",
        downloadURL: url
      };
      delete state.uploads[cat][key];
    } else if (key.indexOf("specAttach_") === 0) {
      const sid = key.slice(11);
      if (!d.specAttachments) d.specAttachments = {};
      d.specAttachments[sid] = {
        path: dest,
        storagePath: dest,
        label: "Uploaded",
        downloadURL: url
      };
      delete state.uploads[cat][key];
    } else if (key.indexOf("hw_") === 0) {
      const partId = key.slice(3);
      const wh = ensureWindowHardware(d);
      if (wh.parts[partId]) wh.parts[partId].imageUrl = url;
      delete state.uploads[cat][key];
    } else if (key.indexOf("trim_") === 0) {
      const opt = trimOptionFromSlug(key.slice(5));
      ensureTrimDetail(d, opt).imageUrl = url;
      delete state.uploads[cat][key];
    } else {
      if (!d.swatchUrls) d.swatchUrls = {};
      d.swatchUrls[key] = url;
    }
    if (state.uploads[cat]) delete state.uploads[cat][key];
  }
  state.uploadFiles[cat] = {};
}

function dataUriToBlob(dataUri) {
  const s = String(dataUri || "");
  const m = s.match(/^data:([^;,]+)?(;base64)?,(.*)$/);
  if (!m) return null;
  const contentType = m[1] || "image/jpeg";
  const isBase64 = !!m[2];
  const body = m[3] || "";
  const bin = isBase64 ? atob(body) : decodeURIComponent(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const ext = contentType.split("/").pop().replace(/[^a-z0-9]/gi, "").toLowerCase() || "jpg";
  return { blob: new Blob([bytes], { type: contentType }), contentType, ext };
}

function normalizePickerAssetPath(p) {
  const s = String(p || "").trim();
  if (!s) return "";
  try {
    const u = new URL(s);
    return decodeURIComponent(u.pathname || "").replace(/^\/+/, "");
  } catch (e) {
    return s.replace(/^\/+/, "");
  }
}
function pickerPathBasename(p) {
  const n = normalizePickerAssetPath(p);
  const i = n.lastIndexOf("/");
  return i >= 0 ? n.slice(i + 1) : n;
}
/** True when library grid row `img` is the same asset as saved picker `sel` (path or URL). */
function pickerGridImageMatches(sel, img) {
  if (!sel || !img) return false;
  const ip = String(img.path || "");
  const sp = String(sel.path || "");
  const sst = String(sel.storagePath || "");
  if (ip && (sp === ip || sst === ip)) return true;
  const paths = [ip, sp, sst].map(normalizePickerAssetPath).filter(Boolean);
  if (paths.length >= 2 && paths.every(p => p === paths[0])) return true;
  const bn = pickerPathBasename(ip);
  if (bn && (bn === pickerPathBasename(sp) || bn === pickerPathBasename(sst))) return true;
  const u1 = String(sel.downloadURL || "").trim().split("?")[0];
  const u2 = String(img.downloadURL || "").trim().split("?")[0];
  return !!(u1 && u2 && u1 === u2);
}

function clearPickerSlot(cat, pickerId) {

    if (!Object.keys(state.pickers[cat]).length) delete state.pickers[cat];
  }
  const upKey = "picker_" + pickerId;
  if (state.uploads[cat]) delete state.uploads[cat][upKey];
  if (state.uploadFiles[cat]) delete state.uploadFiles[cat][upKey];
  updatePreview();
  renderForm();
}

function queueHardwarePartFromComputer(cat, partId) {

  inp.addEventListener("change", e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    getCatData(cat);
    if (!state.uploads[cat]) state.uploads[cat] = {};
    if (!state.uploadFiles[cat]) state.uploadFiles[cat] = {};
    const key = hardwarePartUploadKey(partId);
    const r = new FileReader();
    r.onload = () => {
      state.uploads[cat][key] = r.result;
      state.uploadFiles[cat][key] = f;
      updatePreview();
      renderForm();
    };
    r.readAsDataURL(f);
  });
  inp.click();
}

function suggestedLibraryKeyForCategory(cat) {
  const cfg = CATS[cat] || { pickers: [] };
  const pickers = cfg.pickers || [];
  const lr = state.libraryRail;
  if (lr && lr.targetPickerId) {
    const picked = pickers.find(p => p.id === lr.targetPickerId);
    if (picked && picked.category && LIBRARY[picked.category]) return picked.category;
  }
  const first = pickers[0];
  if (first && first.category && LIBRARY[first.category]) return first.category;
  return "windows";
}
/** When user has not manually chosen a Storage folder, keep rail aligned with the active “Apply selection to” slot (not always the first picker — drapery’s first was pleats). */
function syncLibraryRailToTemplateIfAllowed() {
  const lr = state.libraryRail;
  if (!lr || lr.userPickedFolder) return;
  const cat = state.category;
  const cfg = CATS[cat] || { pickers: [] };
  const allRailPickers = (cfg.pickers || []).filter(p => p.category && LIBRARY[p.category]);
  if (!lr.targetPickerId || !allRailPickers.some(p => p.id === lr.targetPickerId)) {
    lr.targetPickerId = allRailPickers[0] ? allRailPickers[0].id : "";

  if (lr.libKey !== sug) {
    lr.libKey = sug;
    lr.segments = [];
  }
}

async function renderLibraryRail() {

  } catch (eV) {}
  const filterInp = el("input", {

    class: "lib-rail-filter",

  });
  function applyRailFilterFromInput() {
    lr.q = filterInp.value || "";

    libraryRailFilterDebounceTimer = setTimeout(() => {

      renderLibraryRail();
    }, 180);

  files.forEach(img => {

    card.addEventListener("click", () => {

  s.addText(tTitle, { x:10.5, y:0.64, w:2.4, h:0.55, bold:true, fontSize:9, align:"right" });
  s.addText("DESIGN INTENT", { x:0.5, y:1.32, w:2.8, h:0.25, bold:true, fontSize:10 });
  const detailsLine = []
    .concat((d.treatmentOptions && d.treatmentOptions.length) ? ["Layers: " + d.treatmentOptions.join(", ")] : [])
    .concat((isWindowTreatmentCategory(cat) && d.sameWindowTagMultipleTreatments) ? ["Multiple treatments on one window tag"] : [])

    .concat((cat === "roller" && d.specs) ? [

      ...(String(d.specs.rollerPairing || "").trim() && String(d.specs.rollerPairing).trim() !== "Single tube"
        ? ["Layer / pairing: " + String(d.specs.rollerPairing).trim()] : [])
    ] : []);
  const intentAndLayers = (d.designIntent || "") + (detailsLine.length ? ("\n\n" + detailsLine.join("\n")) : "");
  s.addText(intentAndLayers, { x:0.5, y:1.58, w:2.9, h:1.05, fontSize:8.5, italic:true });
  const renderData = state.uploads[cat] && state.uploads[cat].rendering ? state.uploads[cat].rendering : await urlToDataUri(d.renderingUrl);
  if (renderData) s.addImage({ data: renderData, x:3.65, y:1.3, w:6.0, h:2.4, sizing:{ type:"contain", w:6.0, h:2.4 } });
  let sy = 4.0;
  async function addPptxDetailImage(raw, title, idx, imgH) {
    if (!raw) return false;
    const dataUri = String(raw).startsWith("data:") ? raw : await urlToDataUri(raw);
    if (!dataUri) return false;
    const col = idx % 4;
    const row = Math.floor(idx / 4);
    const x = 0.5 + col * 3.1;
    const y = sy + row * (imgH + 0.35);
    if (title) s.addText(String(title).toUpperCase(), { x, y, w:2.95, h:0.14, fontSize:6.5, bold:true });
    s.addImage({ data:dataUri, x, y:y + (title ? 0.16 : 0), w:2.95, h:imgH, sizing:{ type:"contain", w:2.95, h:imgH } });
    return true;
  }
  if (cat === "roller") {
    let detailIdx = 0;
    for (const p of (cfg.pickers || [])) {
      const sel = pks[p.id];
      const raw = (state.uploads[cat] && state.uploads[cat]["picker_" + p.id]) || (sel && sel.downloadURL) || "";
      if (await addPptxDetailImage(raw, p.label, detailIdx, 0.72)) detailIdx++;
    }
    for (let i = 0; i < 3; i++) {
      const k = "rollerSlot" + i;
      const raw = (state.uploads[cat] && state.uploads[cat][k]) || ((d.swatchUrls || {})[k] || "");
      if (await addPptxDetailImage(raw, detailSlotHeading(k, d, ensureImageCaptions(d), "Detail " + (i + 1)), detailIdx, 0.72)) detailIdx++;
    }
  } else {
    for (let i = 0; i < Math.min(4, cfg.pickers.length); i++) {
      const p = cfg.pickers[i];
      const sel = pks[p.id];
      if (!sel || !sel.downloadURL) continue;
      if (i === 3 && (state.uploads[cat] && state.uploads[cat].custom4 || ((d.swatchUrls || {}).custom4 || ""))) continue;
      const dataUri = await urlToDataUri(sel.downloadURL);
      if (dataUri) s.addImage({ data:dataUri, x:0.5 + i*3.1, y:sy, w:2.95, h:1.05, sizing:{ type:"contain", w:2.95, h:1.05 } });
    }
    const custom4 = (state.uploads[cat] && state.uploads[cat].custom4) || ((d.swatchUrls || {}).custom4 || "");
    if (custom4) {
      const custom4Data = custom4.startsWith("data:") ? custom4 : await urlToDataUri(custom4);
      if (custom4Data) s.addImage({ data:custom4Data, x:0.5 + 3*3.1, y:sy, w:2.95, h:1.05, sizing:{ type:"contain", w:2.95, h:1.05 } });
    }
  }
  if (isWindowTreatmentCategory(cat) && cat !== "roller") {
    const capsP = ensureImageCaptions(d);
    const secData = (state.uploads[cat] && state.uploads[cat].sectionView) || await urlToDataUri(d.sectionViewUrl);
    if (secData) {
      const secHead = detailSlotHeading("sectionView", d, capsP, "SECTION VIEW");
      s.addText(secHead, { x:0.5, y:5.12, w:12, h:0.18, fontSize:8, bold:true });
      s.addImage({ data:secData, x:0.5, y:5.32, w:12, h:1.85, sizing:{ type:"contain", w:12, h:1.85 } });
    }
  }
  const fname = "CCH_" + tTitle.replace(/\W+/g, "_") + "_" + (d.workOrder || "WO") + "_" + (d.project || "Project").replace(/\W+/g, "_") + ".pptx";
  try {
    const blob = await pres.write({ outputType:"blob" });
    await saveExportBlob(blob, fname);
    const href = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = href;
    a.download = fname;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 1000);
  } catch (e) {
    console.warn("Blob export fallback", e);
    await pres.writeFile({ fileName: fname });
  }
}

async function saveExportBlob(blob, fname) {
  const cat = state.category;
  const d = getCatData(cat);
  const projectId = (d.projectId || "").trim();
  if (!projectId || !state.currentWorkOrderId || !blob) return;
  const path = "projects/" + projectId + "/workOrders/" + state.currentWorkOrderId + "/exports/" + Date.now() + "-" + fname;
  const ref = storage.ref(path);
  await ref.put(blob, { contentType:"application/vnd.openxmlformats-officedocument.presentationml.presentation" });
  const url = await ref.getDownloadURL();
  await db.collection("boards").doc(projectId).collection("workOrders").doc(state.currentWorkOrderId).set({
    exportPptxUrl: url,
    exportPptxPath: path,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge:true });
}

async function urlToDataUri(url) {
  if (!url) return "";
  try {
    const r = await fetch(url);
    const blob = await r.blob();
    return await new Promise(res => {
      const fr = new FileReader();
      fr.onload = e => res(e.target.result);
      fr.readAsDataURL(blob);
    });
  } catch (e) { return ""; }
}

    let pMeta = state.projects.find(p => p.id === d.projectId);

    if (pMeta) {
      if (!String(d.project || "").trim()) d.project = pMeta.name || pMeta.id || "";
      if (!String(d.address || "").trim()) d.address = pMeta.address || "";
    }

    const fabricActions = el("div", { style:"display:flex;gap:8px;flex-wrap:wrap" });
    fabricActions.append(el("button", {
      type:"button",
      class:"btn secondary",
      style:"padding:8px 10px;font-size:10px;letter-spacing:1px",
      onclick: () => {
        const current = getFabricRoleDefs(cat, d);
        if (current.length >= 4) return;
        if (!d.extraFabricRoles) d.extraFabricRoles = [];
        const used = new Set(current.map(x => x.id));
        const nextId = FABRIC_IDS.find(x => !used.has(x));
        if (!nextId) return;
        d.extraFabricRoles.push({ id: nextId, role: "FABRIC " + nextId, slotKind: "fabric" });
        if (!d.fabrics[nextId]) d.fabrics[nextId] = emptyFabricRow();
        renderForm();
      }
    }, "Add Fabric/Trim"));
    fabricToolbar.append(fabricActions);
    fabricToolbar.append(el("div", { style:"font-size:11px;color:var(--muted);margin-top:8px;line-height:1.35" },
      "Each fabric/trim block below has a Yardage (YRD) field — enter yards for workroom ordering."));
    pane.append(fabricToolbar);
  }
  fabricDefs.forEach(fr => {
    const sec = el("div", { class:"form-section" });
    if (!d.fabrics[fr.id] || typeof d.fabrics[fr.id] !== "object") d.fabrics[fr.id] = emptyFabricRow();
    const fab = d.fabrics[fr.id];
    sec.append(el("h2", {}, "Fabric " + fr.id + " - " + fr.role));
    sec.append(fieldYrd(fab.yards, v => { fab.yards = v; updatePreview(); }, { prominent: true }));
    sec.append(field("Use on this treatment", "text", fab.materialUse || "", v => {
      fab.materialUse = v;
      updatePreview();
      scheduleBuilderDraftSave();
    }, "e.g. Main panels, valance face, banding, lining"));
    if (fr.extra) {
      const exTarget = (d.extraFabricRoles || []).find(x => x.id === fr.id);
      const trimRow = el("div", { class: "field", style: "margin:8px 0 10px" });
      trimRow.append(el("label", { style: "display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:12px;line-height:1.35" },
        el("input", {
          type: "checkbox",
          checked: exTarget && exTarget.slotKind === "trim" ? "checked" : undefined,
          style: "margin-top:3px;flex-shrink:0",
          onchange: e => {
            const t = (d.extraFabricRoles || []).find(x => x.id === fr.id);
            if (!t) return;
            t.slotKind = e.target.checked ? "trim" : "fabric";
            const cur = String(t.role || "").trim();
            if (e.target.checked) {
              if (!cur || /^fabric\s+[A-D]$/i.test(cur)) t.role = "TRIM " + fr.id;
            } else {
              if (!cur || /^trim\s+[A-D]$/i.test(cur)) t.role = "FABRIC " + fr.id;
            }
            updatePreview();
            renderForm();
          }
        }),
        el("span", {}, "Treat this row as trim / banding (work order label: Trim). Leave unchecked for a second fabric / lining.")
      ));
      sec.append(trimRow);
      sec.append(field("Role Label", "text", fr.role, v => {
        const target = (d.extraFabricRoles || []).find(x => x.id === fr.id);
        if (target) {
          target.role = v || (target.slotKind === "trim" ? "TRIM " + fr.id : "FABRIC " + fr.id);
        }
        renderForm();
      }));
      sec.append(el("button", {
        type:"button",
        class:"btn secondary",
        style:"padding:7px 10px;font-size:10px;letter-spacing:1px;margin-bottom:8px",
        onclick: () => {
          d.extraFabricRoles = (d.extraFabricRoles || []).filter(x => x.id !== fr.id);
          delete d.fabrics[fr.id];
          const swKey = "swatch_" + fr.id;
          if (d.swatchUrls) delete d.swatchUrls[swKey];
          if (state.uploads[cat]) delete state.uploads[cat][swKey];
          if (state.uploadFiles[cat]) delete state.uploadFiles[cat][swKey];
          renderForm();
        }
      }, "Remove This Fabric/Trim"));
    }
    const pickField = el("div", { class:"field" }, el("label", {}, "Fabric & Trim (catalog + project)"));
    const pickedProd = fab.productId ? resolveMaterialProductById(fab.productId) : null;
    const pickRow = el("div", { style:"display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap" });
    const thumb = el("div", { class:"fabric-pick-thumb" });
    if (pickedProd && pickedProd.imageUrl) thumb.append(el("img", { src: pickedProd.imageUrl, alt: "", loading:"lazy" }));
    else thumb.append(el("span", { style:"font-size:10px;color:#999;padding:8px;text-align:center" }, "Preview"));
    const pickMeta = el("div", { style:"flex:1;min-width:200px" });
    pickMeta.append(el("div", { style:"font-weight:700;font-size:14px;color:var(--ink)" },
      pickedProd ? (pickedProd.title || pickedProd.name || pickedProd.sku || "Selected fabric") : "No fabric selected"));
    pickMeta.append(el("div", { style:"font-size:11px;color:#666;margin-top:4px;line-height:1.35" },
      pickedProd
        ? ((pickedProd.vendor || pickedProd.manufacturer || "") + (pickedProd.category ? " · " + pickedProd.category : ""))
        : "Opens image grid — Fabric & Trim category only."));
    const pickBtns = el("div", { style:"display:flex;flex-direction:column;gap:8px;align-items:stretch" });
    pickBtns.append(el("button", {
      type: "button",
      class: "btn secondary",
      style: "padding:10px 14px;font-size:11px;letter-spacing:1px",
      onclick: () => openFabricWorkOrderPickModal(cat, fr.id)
    }, "Browse fabrics (images)"));
    pickBtns.append(el("button", {
      type: "button",
      class: "btn secondary",
      style: "padding:8px 14px;font-size:10px",
      onclick: () => applyFabricProductPick(cat, fr.id, "")
    }, "Clear fabric"));
    pickRow.append(thumb, pickMeta, pickBtns);
    pickField.append(pickRow);
    sec.append(pickField);
    sec.append(field("Vendor", "text", fab.vendor, v => { fab.vendor = v; updatePreview(); }));
    sec.append(field("Pattern / SKU", "text", fab.sku, v => { fab.sku = v; updatePreview(); }));
    sec.append(fieldRow([["Color", "text", fab.color, v => { fab.color = v; updatePreview(); }], ["Width / dimensions", "text", fab.width, v => { fab.width = v; updatePreview(); }, "Fabric width or trim size (e.g. cut width, pom length, tape width)"]]));
    sec.append(fieldRow([["Content", "text", fab.content, v => { fab.content = v; updatePreview(); }], ["Repeat", "text", fab.repeat, v => { fab.repeat = v; updatePreview(); }]]));
    sec.append(buildUpload(cat, "swatch_" + fr.id, "Upload swatch for Fabric " + fr.id));
    pane.append(sec);
  });
  for (const p of cfg.pickers) {
    const sec = el("div", { class:"form-section" });
    sec.append(el("h2", {}, p.label));
    sec.append(await buildPicker(cat, p));
    pane.append(sec);
  }
  const sec6 = el("div", { class:"form-section", style:"padding-bottom:12px;margin-bottom:16px" });
  const measKeysForm = visibleMeasurementsForCat(cat, cfg, d);
  const measDetails = el("details", { class:"meas-compact-wrap" });
  measDetails.append(el("summary", {}, "Workroom dimensions"));
  const measInner = el("div", { class:"meas-compact-inner" });
  measInner.append(el("div", { class:"meas-compact-note" }, MEAS_WORKROOM_NOTE));
  if (cat === "bedding" && !measKeysForm.length) {
    measInner.append(el("div", { class:"notice", style:"margin:0;font-size:11px;padding:8px" }, "Dimensions appear after you select at least one product type."));
  }
  const measGrid = el("div", { class:"meas-compact-grid" });
  measKeysForm.forEach(m => {
    const inp = el("input", { type:"text", value:d.measurements[m] || "", placeholder:"—" });
    inp.addEventListener("input", e => { d.measurements[m] = e.target.value; updatePreview(); });
    measGrid.append(el("div", { class:"field" }, el("label", {}, m), inp));
  });
  measInner.append(measGrid);
  measDetails.append(measInner);
  sec6.append(measDetails);
  pane.append(sec6);
  const sec7 = el("div", { class:"form-section" });
  sec7.append(el("h2", {}, "Notes & Fabrication"));
  sec7.append(field("Notes (one per line)", "textarea", d.notes.join("\n"), v => { d.notes = v.split("\n").map(x => x.trim()).filter(Boolean); updatePreview(); }));
  sec7.append(field("Fabrication Notes (one per line)", "textarea", d.fabNotes.join("\n"), v => { d.fabNotes = v.split("\n").map(x => x.trim()).filter(Boolean); updatePreview(); }));
  pane.append(sec7);
  const actions = el("div", { class:"actions" });
  actions.append(
    el("button", { class:"btn secondary", onclick: () => saveWorkOrder(false) }, "Save Draft"),
    el("button", { class:"btn secondary", onclick: () => saveAndCloseBuilder() }, "Save + Close"),
    el("button", { class:"btn secondary", onclick: () => saveWorkOrder(true) }, "Save New Revision"),
    el("button", { class:"btn secondary", onclick: async () => {
      const pid = (d.projectId || "").trim();
      if (!pid || !state.currentWorkOrderId) { alert("Save this work order first, then duplicate."); return; }
      await duplicateWorkOrderFromFirestore(pid, state.currentWorkOrderId);
      renderForm();
    }, style: state.currentWorkOrderId ? "" : "display:none" }, "Duplicate as new WO"),
    el("button", { class:"btn", onclick: exportPPTX }, "Export PPTX"),
    el("button", { class:"btn secondary", onclick: exportPDF, title: "Print / Save PDF — 11×17 landscape (tabloid). Use print dialog Scale or Shrink to fit for Letter." }, "Print / PDF (11×17)"),
    el("button", { class:"btn secondary", onclick: () => {
      const pid = (d.projectId || "").trim();
      const prevWo = state.currentWorkOrderId || "";
      state.data[cat] = defaultData(cat); state.pickers[cat] = {}; state.uploads[cat] = {}; state.uploadFiles[cat] = {}; state.currentWorkOrderId = "";
      state.libraryRail = { libKey: "windows", segments: [], q: "", targetPickerId: "", userPickedFolder: false };
      if (pid) {
        try {
          localStorage.removeItem(builderLocalDraftKey(pid, cat, "new"));
          if (prevWo) localStorage.removeItem(builderLocalDraftKey(pid, cat, prevWo));
        } catch (e) {}
      }
      renderForm();
    } }, "Reset")
  );
  pane.append(actions);
  updatePreview();
  updateHeaderSaveUI();
}

document.getElementById("tabs").addEventListener("click", e => {
  if (e.target.tagName !== "BUTTON") return;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
  e.target.classList.add("active");
  const group = e.target.dataset.group || (e.target.dataset.cat ? currentGroupFromCategory(e.target.dataset.cat) : "windows");
  state.uiGroup = group;
  if (group === "windows") {
    if (!["style", "drapery", "roman", "flatfold", "roller"].includes(state.category)) state.category = "style";
  } else if (group === "upholstery") {
    state.category = "upholstery";
  } else if (group === "bedding") {
    state.category = "bedding";
  } else {
    state.category = "pillows";
  }
  // Switching template should not carry an old selected work-order context.
  state.currentWorkOrderId = "";
  if (state.libraryRail) state.libraryRail.userPickedFolder = false;
  const d = getCatData(state.category);
  if (d.projectId) d.workOrder = nextWorkOrderNumber(d.project, state.category, state.workOrdersByProject);
  const _cfg = CATS[state.category];
  const _first = _cfg && _cfg.pickers && _cfg.pickers[0];
  if (_first && state.libraryRail) {
    state.libraryRail.segments = [];
    if (!state.libraryRail.targetPickerId) state.libraryRail.targetPickerId = _first.id;
  }
  renderForm();
});

(function setupPreviewOnlyToggle() {
  const shell = document.getElementById("builderShell");
  const pairs = [
    { only: document.getElementById("previewOnlyBtn"), back: document.getElementById("previewShowFormBtn") },
    { only: document.getElementById("headerPreviewOnlyBtn"), back: document.getElementById("headerPreviewShowFormBtn") }
  ].filter(function(p) { return p.only && p.back; });
  if (!shell || !pairs.length) return;
  function setPreviewOnly(on) {
    if (on) shell.classList.add("preview-only");
    else shell.classList.remove("preview-only");
    pairs.forEach(function(p) {
      p.only.style.display = on ? "none" : "inline-block";
      p.back.style.display = on ? "inline-block" : "none";
    });
  }
  pairs.forEach(function(p) {
    p.only.addEventListener("click", function() { setPreviewOnly(true); });
    p.back.addEventListener("click", function() { setPreviewOnly(false); });
  });
})();


(function setupHeaderSaveButton() {
  const btn = document.getElementById("headerSaveBtn");
  if (!btn || btn.dataset.bound) return;
  btn.dataset.bound = "1";
  btn.addEventListener("click", () => saveWorkOrder(false));
})();

(function setupLibraryRailToggle() {
  const h = document.getElementById("headerToggleLibraryRailBtn");
  if (!h || h.dataset.bound) return;
  h.dataset.bound = "1";
  h.addEventListener("click", toggleLibraryRailFromUi);
})();

auth.onAuthStateChanged(async user => {
  const note = document.getElementById("authNote");
  const authBar = document.getElementById("builderAuthBar");

  if (!user) {
    note.textContent = "Not signed in";
    if (authBar) authBar.style.display = "block";
    document.body.classList.remove("builder-signed-in");
    return;
  }
  state.currentUser = user;
  document.body.classList.add("builder-signed-in");
  note.textContent = (user.email || user.uid || "").trim() || "Signed in";
  if (authBar) authBar.style.display = "none";
  const shell = document.getElementById("builderShell");
  if (shell) shell.style.display = "grid";
  applyLibraryRailHiddenFromStorage();
  document.getElementById("app").style.display = "grid";
  state.uiGroup = currentGroupFromCategory(state.category);
  document.querySelectorAll("#tabs button").forEach(b => {
    const grp = b.dataset.group || (b.dataset.cat ? currentGroupFromCategory(b.dataset.cat) : "windows");
    b.classList.toggle("active", grp === state.uiGroup);
  });
  state.builderBootError = "";
  startProductLibraryLoad();
  await Promise.all([loadProjects(), loadWorkrooms()]);
  await applyBuilderQueryParams();
  try {
    await renderForm();
  } catch (e) {
    console.error("[Builder] renderForm failed", e);
    const pane = document.getElementById("formPane");
    if (pane) {
      pane.innerHTML = "";
      pane.append(el("div", { class: "notice error", role: "alert" },
        "The builder stopped with a script error while drawing the form. Try a hard refresh (Ctrl+Shift+R). If it keeps happening, open the developer console and report the first red error line."));
    }
    try {
      await renderLibraryRail();
    } catch (e2) {
      console.warn("[Builder] renderLibraryRail after form error", e2);
    }
  }
});
</script>
</body>
